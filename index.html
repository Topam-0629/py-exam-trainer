/* 레이아웃: 상단 챕터 바 + 좌(설명)/우(코드) 2단 + 하단 이동 바, 오른쪽 코치 서랍. 경기장 야간 조명 같은 블랙 + 네온 그린 */
:root{
  --bg:#060807; --panel:#0c110f; --panel2:#111814; --raise:#16201b; --line:#1f2c25; --line2:#2a3a31;
  --fg:#e9f5ee; --fg2:#b9cdc2; --dim:#7d9488;
  --accent:#1cf28a; --accent2:#0fbf6a; --accent-ink:#02160b; --glow:rgba(28,242,138,.28);
  --gold:#ffd34a; --bad:#ff5468; --bad-bg:rgba(255,84,104,.12); --good-bg:rgba(28,242,138,.10);
  --code:#080c0a;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--f-body);margin:0;overflow:hidden;
  background-image:radial-gradient(1200px 500px at 70% -200px,rgba(28,242,138,.10),transparent 60%),repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.012) 46px 47px)}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;transition:padding-right .25s}
body.coach-open .app{padding-right:min(420px,40vw)}
button{font:inherit;color:inherit;cursor:pointer}
code,kbd,pre{font-family:var(--f-mono)}
code{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:.05em .35em;font-size:.88em;color:#c9ffe2}
kbd{font-size:.75em;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 .35em;color:var(--fg2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 상단 바 */
.top{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0a0f0c,#070a08)}
.logo{font:24px/1 var(--f-display);letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:4px 9px 3px;transform:skewX(-14deg);display:inline-block;box-shadow:0 0 18px var(--glow)}
.logo i b{display:inline-block;transform:skewX(14deg);font-weight:400}
.chapters{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.chap{position:relative;flex:1 1 0;min-width:88px;border:0;background:var(--panel2);padding:7px 14px 8px;transform:skewX(-14deg);text-align:left;overflow:hidden;border-bottom:3px solid var(--line2)}
.chap>*{display:block;transform:skewX(14deg)}
.chap::before{content:"";position:absolute;inset:auto 0 -3px 0;height:3px;background:var(--accent);transform-origin:left;transform:scaleX(var(--f,0));transition:transform .4s}
.chap .cn{font:11px/1 var(--f-mono);color:var(--dim)}
.chap .ct{font:15px/1.3 var(--f-display);margin-top:3px;white-space:nowrap}
.chap .cm{font-size:11px;color:var(--dim);line-height:1.2}
.chap.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 22px var(--glow)}
.chap.on .cn,.chap.on .cm{color:#063a20}
.chap:hover:not(.on){background:var(--raise)}
.timer{--p:0;min-width:150px;text-align:left;margin-left:8px;font-family:var(--f-mono);line-height:1.1}
.timer b{font-size:22px;color:var(--accent)} .timer span{font-size:12px;color:var(--dim);margin-left:4px}
.timer::after{content:"";display:block;height:3px;margin-top:5px;background:linear-gradient(90deg,var(--accent) calc(var(--p)*100%),var(--line) 0)}
.pypill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pypill.ready{color:var(--accent);border-color:rgba(28,242,138,.4)} .pypill.error{color:var(--bad);border-color:var(--bad)}
.pypill.loading::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.coachbtn{border:1px solid var(--accent);background:transparent;color:var(--accent);padding:10px 20px;font-size:15px;font-weight:700;transform:skewX(-14deg)}
.coachbtn span{display:inline-block;transform:skewX(14deg)}
body.coach-open .coachbtn{background:var(--accent);color:var(--accent-ink)}

.dotsbar{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.dot{width:22px;height:8px;border:0;background:var(--line2);transform:skewX(-20deg);padding:0}
.dot.ok{background:var(--accent2)} .dot.on{background:var(--fg);box-shadow:0 0 10px rgba(255,255,255,.5)}
.dot.t-code,.dot.t-gen{height:12px} .dot.t-type{height:12px;background-image:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.35) 3px 5px)}
.stepinfo{font-size:13px;color:var(--fg2);white-space:nowrap}

/* 본문 */
.main{min-height:0;display:grid;grid-template-columns:minmax(0,44fr) minmax(0,56fr)}
.main.t-intro,.main.t-finish,.main.t-mc,.main.t-quiz,.main.t-type,.main.t-learn:has(.solo){display:block;overflow-y:auto}
.lesson-col{overflow-y:auto;padding:28px max(28px,env(safe-area-inset-left,0px)) 40px 36px;border-right:1px solid var(--line)}
.ws-col{overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 32px 20px;background:var(--panel)}
.solo{max-width:880px;margin:0 auto;padding:40px max(24px,env(safe-area-inset-right,0px)) 60px max(24px,env(safe-area-inset-left,0px))}
.solo.wide{max-width:1100px}
.eyebrow{font:13px/1 var(--f-mono);letter-spacing:.14em;color:var(--accent);margin-bottom:10px;display:flex;gap:10px;align-items:center}
.eyebrow span{letter-spacing:0;font-family:var(--f-body);font-weight:700;color:var(--accent-ink);background:var(--accent);padding:3px 8px 2px;transform:skewX(-14deg)}
h1{font:34px/1.2 var(--f-display);margin:0 0 18px;text-wrap:balance;font-weight:400;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.intro h1{font-size:46px}
.lesson{font-size:17px;line-height:1.8;max-width:68ch}
.lesson p{margin:0 0 14px} .lesson ul,.lesson ol,.solo ul,.solo ol{padding-left:1.3em;margin:0 0 14px} .lesson li{margin:4px 0}
.lead{font-size:20px;line-height:1.7;color:var(--fg);max-width:60ch}
.dim{color:var(--dim);font-size:14px} .bad{color:var(--bad)}
.tip,.warn,.blanknote{border-left:4px solid var(--accent);background:var(--good-bg);padding:12px 16px;margin:16px 0;font-size:15.5px;line-height:1.7}
.warn{border-color:var(--gold);background:rgba(255,211,74,.08)}
.blanknote{border-color:var(--fg2);background:var(--panel2)}
.answer{background:var(--panel2);border:1px solid var(--line2);padding:16px 18px;line-height:1.85;font-size:16.5px;margin:12px 0}
.kw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--dim)}
.kw span{color:var(--accent);border:1px solid rgba(28,242,138,.35);padding:1px 9px;border-radius:99px}
pre.code{background:var(--code);border:1px solid var(--line);padding:12px 14px;overflow-x:auto;font-size:14.5px;line-height:1.6;color:#c9ffe2}
.goals{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:20px!important}
.goals li{background:var(--panel2);border:1px solid var(--line);padding:10px 14px;position:relative;padding-left:30px}
.goals li::before{content:"";position:absolute;left:12px;top:19px;width:8px;height:8px;background:var(--accent);transform:skewX(-14deg)}
.exam-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0}
.exam-map>div{background:var(--panel2);border:1px solid var(--line);padding:14px 16px;font-size:15px;line-height:1.7}
.tag{display:inline-block;font:15px/1 var(--f-display);color:var(--accent-ink);background:var(--accent);padding:4px 10px 3px;margin-bottom:8px;transform:skewX(-14deg)}
table.tbl,table.cmp{border-collapse:collapse;font-size:14.5px;margin:12px 0;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:4px 12px;border-bottom:1px solid var(--line);text-align:center}
.tbl th{color:var(--fg2);font-weight:500} .tbl tr:first-child th{color:var(--accent);font-weight:700}
.tbl.np td{border:1px solid var(--line2);font-family:var(--f-mono);min-width:34px}
.tbl.np tr:first-child td{background:rgba(255,120,40,.18)} .tbl.np td:first-child{background:rgba(255,211,74,.15)}
.cmp th,.cmp td{border:1px solid var(--line);padding:7px 12px;text-align:left;vertical-align:top}
.cmp th{background:var(--panel2);color:var(--accent);font-weight:700}
.cmp td.bad{color:var(--bad)} .cmp td.good{color:var(--accent)}
.opt3{display:flex;gap:12px;flex-wrap:wrap} .opt3 .cmp{margin:0}
.axis-fig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.axf{background:var(--panel2);border:1px solid var(--line2);padding:12px 14px;font-size:15px;line-height:1.7}
.axf b{color:var(--accent);font-size:17px} .axf span{color:var(--gold);font-size:14px}
.shape-demo{display:flex;align-items:center;gap:18px;margin:14px 0;font-family:var(--f-mono)}
.shape-demo i{font-style:normal;display:block;width:34px;height:30px;line-height:30px;text-align:center;background:rgba(255,211,74,.85);color:#231a00;border:1px solid #6b5600;font-weight:700}
.row3{display:flex} .col3{display:flex;flex-direction:column} .shape-demo span{color:var(--dim)}
.boxes{display:flex;align-items:flex-end;gap:4px;margin:14px 0;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;font-family:var(--f-mono)}
.boxes .lbl{font-weight:700;color:var(--accent);margin-right:8px;align-self:center;font-size:17px}
.boxes .bx{display:flex;flex-direction:column;align-items:center;gap:4px}
.boxes .bx i,.boxes .bx em{font-style:normal;font-size:12px;color:var(--gold)}
.boxes .bx b{display:block;min-width:44px;padding:10px 8px;white-space:nowrap;text-align:center;border:2px solid var(--accent2);background:rgba(28,242,138,.07);font-weight:600;font-size:15px}
.example{margin-top:18px;border:1px solid var(--line2);background:var(--code)}
.ex-h{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel2);font:14px/1 var(--f-display);color:var(--accent)}
.example>pre{margin:0;padding:12px 14px;font-size:14.5px;line-height:1.6;overflow-x:auto;color:#c9ffe2}
.exout{border-top:1px dashed var(--line2);padding:8px 12px 12px}
.ex-oh{font-size:12px;color:var(--dim);margin-bottom:4px}
.exout pre{margin:0;font-size:14px;line-height:1.5;overflow-x:auto;color:#e6fff1}
.exout .fig{margin-top:8px}
.selfnote{border-left:4px solid var(--accent);background:var(--good-bg);padding:10px 14px;margin-bottom:12px;font-size:15px;line-height:1.7}
.selfnote b:first-child{display:block;font:17px/1.3 var(--f-display);color:var(--accent);margin-bottom:2px}
.scratchbtn{border-color:var(--fg2);color:var(--fg2)} .scratchbtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mission{border:2px solid var(--gold);background:rgba(255,211,74,.06);padding:12px 14px;margin-bottom:14px}
.mission.done{border-color:var(--accent);background:var(--good-bg)}
.mission p{margin:8px 0 0;font-size:15.5px;line-height:1.7}
.mission .target{margin-top:10px}
.ms-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ms-tag{font:16px/1 var(--f-display);background:var(--gold);color:#241a00;padding:5px 10px 4px;transform:skewX(-12deg)}
.mission.done .ms-tag{background:var(--accent);color:var(--accent-ink)}
.ms-lock{font-size:13px;color:var(--gold)} .ms-ok{font-weight:700;color:var(--accent)}
.mission.solo-m{margin:4px 0 20px}
.mission.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#next.locked{background:var(--panel2);color:var(--fg2);border-color:var(--line2);box-shadow:none}
.chap.locked{opacity:.45} .dot.locked{opacity:.35}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:12px 20px;font-size:15px;opacity:0;pointer-events:none;transition:all .2s;z-index:30;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.whobtn{border:1px solid var(--line2);background:var(--panel2);color:var(--fg);padding:6px 12px;font-size:14px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.whobtn:hover{border-color:var(--accent)}
.pf-overlay{position:fixed;inset:0;z-index:40;background:rgba(3,6,4,.94);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:8vh max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.pf-box{width:min(720px,100%)}
.pf-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:18px 0}
.pf-card{position:relative;display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line2)}
.pf-card.cur{border-color:var(--accent)}
.pf-pick{border:0;background:none;text-align:left;padding:14px 14px 10px;display:flex;flex-direction:column;gap:6px}
.pf-pick:hover{background:var(--raise)}
.pf-pick b{font:20px/1.2 var(--f-display);font-weight:400}
.pf-bar{height:4px;background:linear-gradient(90deg,var(--accent) calc(var(--p)*100%),var(--line) 0)}
.pf-meta{font-size:13px;color:var(--dim);font-family:var(--f-mono)}
.pf-del{align-self:flex-end;margin:0 8px 8px;font-size:12px}
.pf-del.arm{border-color:var(--bad);color:var(--bad)}
.pf-new{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.pf-new input{flex:1;min-width:200px;background:var(--code);border:1px solid var(--line2);color:var(--fg);padding:10px 12px;font:16px var(--f-body)}

{ t:'learn', title:'④ 딕셔너리: 이름표 붙은 칸', body:`
<p>리스트는 칸을 <b>번호</b>(0, 1, 2…)로 찾았죠. <b>딕셔너리</b>는 칸을 <b>이름</b>으로 찾아요. 영어사전처럼 "단어 → 뜻"을 짝지어 저장해요.</p>
<pre class="code">info = {'name': '민수', 'age': 17}</pre>
<div class="boxes"><span class="lbl">info</span><div class="bx"><i>'name'</i><b>'민수'</b></div><div class="bx"><i>'age'</i><b>17</b></div></div>
<ul><li>중괄호 <code>{ }</code>로 감싸요 (리스트는 대괄호 <code>[ ]</code>)</li>
<li><code>'이름': 값</code> — 이름을 <b>키(key)</b>, 값을 <b>밸류(value)</b>라고 해요</li>
<li>키와 값 사이는 콜론 <code>:</code>, 짝과 짝 사이는 쉼표 <code>,</code></li>
<li>꺼낼 때: <code>info['age']</code> → 17 (대괄호 안에 <b>키 이름</b>)</li></ul>`,
 code:`info = {'name': '민수', 'age': 17}
print(info)
print(info['name'])
print(info['age'])`},

{ t:'code', title:'해보기: 딕셔너리', body:`<p>키 <code>'nickname'</code>에 <code>'Shark'</code>, 키 <code>'age'</code>에 <code>60</code>이 들어 있는 딕셔너리 <code>grandpa</code>를 만들고, <b>age 값만</b> 출력하세요.</p><pre class="code">60</pre>`,
 ref:`grandpa = {'nickname': 'Shark', 'age': 60}\nprint(grandpa['age'])`, check:'out', hints:["{'키': 값, '키': 값}","grandpa = {'nickname': 'Shark', 'age': 60}","print(grandpa['age'])"]},

{ t:'learn', title:'딕셔너리 + 리스트 = 판다스 표의 재료', body:`
<p>딕셔너리의 값 자리에 <b>리스트</b>를 넣을 수 있어요. 이게 판다스 시험 1번의 핵심이에요.</p>
<pre class="code">data = {'age': [60, 70, 12],
        'nickname': ['Shark', 'Audrey', 'Smurf']}</pre>
<p>이걸 표로 바꾸면 <b>키가 열 이름</b>, <b>리스트가 그 열의 값</b>이 돼요.</p>
<table class="tbl"><tr><th></th><th>age</th><th>nickname</th></tr><tr><th>0</th><td>60</td><td>Shark</td></tr><tr><th>1</th><td>70</td><td>Audrey</td></tr><tr><th>2</th><td>12</td><td>Smurf</td></tr></table>
<div class="tip">지금은 "딕셔너리 → 표가 된다"는 것만 기억하세요. 표로 바꾸는 방법은 판다스 챕터에서 배워요.</div>`,
 code:`data = {'age': [60, 70, 12],
        'nickname': ['Shark', 'Audrey', 'Smurf']}
print(data['age'])
print(data['nickname'][0])   # nickname 리스트의 첫 칸`},

{ t:'mc', title:'확인: 괄호 구별', q:'다음 중 <b>딕셔너리</b>는?', opts:["[60, 70, 12]","{'age': 60, 'weight': 3.8}","print(60)","(60, 70)"], ans:1, exp:'중괄호 { } 안에 \'키\': 값 짝이 있으면 딕셔너리예요. [ ]는 리스트예요. ( )는 바로 뒤 단계에서 정리해요.'},

{ t:'learn', title:'괄호 세 종류 정리', body:`
<table class="cmp"><tr><th>괄호</th><th>뜻</th><th>시험 코드 예</th></tr>
<tr><td><code>[ ]</code> 대괄호</td><td>① 리스트 만들기<br>② 칸 꺼내기</td><td><code>[3.8, 7.2]</code><br><code>x[0]</code>, <code>df['age']</code></td></tr>
<tr><td><code>{ }</code> 중괄호</td><td>딕셔너리 만들기</td><td><code>{'age': [60, 70]}</code></td></tr>
<tr><td><code>( )</code> 소괄호</td><td>① 함수 실행 (기계에 재료 넣기, ⑤에서 자세히)<br>② 값 묶음: 이름 없이 값만 쉼표로 나열</td><td><code>print(x)</code>, <code>plt.show()</code><br><code>(5, 5)</code>, <code>(3, 5)</code></td></tr></table>
<div class="tip">시험 코드에서 괄호가 헷갈리면 이 표로 돌아오세요.</div>`},

{ t:'learn', title:'⑤ 함수: 재료를 넣으면 일을 하는 기계', body:`
<p><b>함수</b>는 <code>이름( )</code> 모양이에요. 괄호 안에 재료를 넣으면 일을 해요.</p>
<ul><li><code>print('안녕')</code> — 화면에 보여주는 기계</li><li><code>len([1, 2, 3])</code> — 칸 개수를 세는 기계 → 3</li></ul>
<p>재료 말고 <b>옵션</b>도 줄 수 있어요. <code>옵션이름=값</code> 모양이에요.</p>
<pre class="code">print('a', 'b', sep='-')   # sep 옵션: 사이에 - 넣기 → a-b</pre>
<p>시험에 나오는 옵션들이 다 이 모양이에요: <code>marker='*'</code>, <code>color='m'</code>, <code>axis=1</code>, <code>index=[...]</code>, <code>inplace=True</code></p>
<div class="tip">순서: 재료 먼저, 옵션(<code>이름=값</code>)은 뒤에. 옵션끼리는 순서 상관없어요.</div>`,
 code:`print('a', 'b', 'c')
print('a', 'b', 'c', sep='-')
print(len([3.8, 7.2, 6.3]))`},

{ t:'learn', title:'⑥ import: 도구 상자 꺼내기', body:`
<p>파이썬에 기본으로 없는 기능은 <b>라이브러리</b>(도구 상자)를 불러와서 써요.</p>
<pre class="code">import numpy as np
import pandas as pd
import matplotlib.pyplot as plt</pre>
<ul><li><code>import numpy</code> = numpy 도구 상자를 꺼내라</li><li><code>as np</code> = 앞으로 짧게 <b>np</b>라고 부를게</li></ul>
<p>그다음부터는 <code>np.array( )</code>, <code>pd.DataFrame( )</code>, <code>plt.plot( )</code>처럼 <b>별명 + 점 + 함수</b>로 써요. 점(<code>.</code>)은 "~ 안에 있는"이라는 뜻이에요.</p>
<p>도구 상자에서 <b>도구 하나만</b> 꺼낼 때는 <code>from</code>을 써요.</p>
<pre class="code">from sklearn.linear_model import LinearRegression
# sklearn.linear_model 상자에서 LinearRegression 도구만 꺼내기</pre>
<p>그러면 앞에 별명 없이 <code>LinearRegression()</code>처럼 바로 써요. (머신러닝 챕터에서 나와요)</p>
<div class="warn">맨 위에 import를 안 쓰면 <code>NameError: name 'np' is not defined</code> 오류가 나요.</div>`,
 code:`import numpy as np
import pandas as pd
import matplotlib.pyplot as plt
print('도구 상자 3개 준비 완료')`},

{ t:'learn', title:'⑦ Thonny는 print를 해야 보여요', body:`
<p>학교 컴퓨터의 <b>Thonny</b>는 코드를 위에서 아래로 실행하고, <b>print 한 것만</b> 화면에 보여줘요.</p>
<table class="cmp"><tr><th>코드</th><th>Thonny 화면</th></tr>
<tr><td><code>x = 3</code><br><code>x</code></td><td class="bad">아무것도 안 나옴</td></tr>
<tr><td><code>x = 3</code><br><code>print(x)</code></td><td class="good">3</td></tr></table>
<div class="warn">인터넷에서 본 코랩 코드는 마지막 줄에 <code>df</code>만 써도 표가 나오지만, <b>시험에서는 꼭 <code>print(df)</code></b>로 써야 해요. 그래프는 <code>plt.show()</code>.</div>
<p>이 연습장도 Thonny와 똑같이 동작해요.</p>`,
 code:`x = 3
x          # 아무것도 안 나와요
print(x)   # 이것만 나와요`},

/* ================= CH2 넘파이 ================= */
{ id:'c2', title:'넘파이', short:'NUMPY', mins:33, steps:[
{ t:'intro', title:'넘파이 NumPy', body:`<p class="lead">시험 넘파이 3문제: <b>① 라이브러리 설명 + 2차원 배열 + 함수 2개</b>, <b>② arange → reshape</b>, <b>③ arange·reshape로 연산</b>.</p>
${NP_TABLE}
<ul class="goals"><li>2차원 배열 만들기</li><li>axis=0과 axis=1 구분하기</li><li>합계·중앙값·평균·최댓값·최솟값·분산·표준편차·any·all·where</li><li>arange, reshape, 배열 연산</li></ul>`},
{ t:'learn', title:'넘파이란? (설명 외우기)', body:`
<p>시험 1번은 <b>"넘파이 라이브러리를 설명하고"</b>로 시작해요. 아래 답안을 이해하고 핵심 단어를 외우세요.</p>
<div class="answer">${DESC_NP}</div>
<p class="kw">핵심 단어: <span>다차원 배열</span><span>수치 계산</span><span>빠른 계산</span><span>통계 함수</span><span>판다스·맷플롯립의 기반</span></p>`},
{ t:'learn', title:'np.array로 2차원 배열 만들기', body:`
<p><b>왜 넘파이를 써요?</b> 그냥 리스트는 값을 <b>담기만</b> 하는 상자라서 "합계", "평균", "최댓값" 같은 표 계산을 바로 못 해요. 넘파이 배열로 바꾸면 그런 <b>표 계산 기능</b>이 생겨요. 그리고 시험 1번이 넘파이로 배열을 만드는 문제예요.</p>
<p><code>np.array( )</code> 함수의 <b>소괄호 안에</b> 2차원 리스트를 넣으면 넘파이 배열이 돼요.</p>
${NP_TABLE}
<ul><li>바깥 대괄호 <code>[ ]</code> 안에 <b>한 줄(행)마다</b> 대괄호 하나씩</li>
<li><code>a.shape</code> → (행 수, 열 수) = (3, 5)</li>
<li><code>a.ndim</code> → 차원 수 = 2</li></ul>
<div class="warn"><b>자주 틀리는 곳</b>: <code>np.array</code>는 함수라서 바로 뒤에 <b>소괄호 <code>(</code></b>가 와야 해요.<br>✅ <code>np.array([[1, 4], [2, 1]])</code> &nbsp; ❌ <code>np.array[[1, 4], [2, 1]]</code> (소괄호 빠짐 → 오류)<br>괄호 순서: <code>np.array(</code> → 표 전체 <code>[</code> → 줄마다 <code>[...]</code> → 맨 끝은 <code>]])</code></div>`,
 code: NP_A + `
print(a)
print(a.shape)
print(a.ndim)`},
{ t:'code', title:'문제: 시험 배열 만들기', body:`<p>아래 배열을 넘파이로 만들어 <code>a</code>에 저장하고 출력하세요.</p>${NP_TABLE}`,
 ref: NP_A + `\nprint(a)`, check:'out', hints:['맨 위에 import numpy as np','a = np.array([[1, 4, 3, 7, 8], ... ])','세 줄 모두 넣고 print(a)']},
{ t:'type', title:'타자: 시험 배열', target: NP_A + `\nprint(a)`},
{ t:'learn', title:'axis: 방향이 핵심', body:`
<p>넘파이에는 계산 함수가 있어요. 예를 들어 <code>np.sum(a)</code>는 배열 <code>a</code>의 <b>합계</b>를 구해요. (<code>np.함수이름(배열)</code> 모양 — 교과서가 쓰는 방식)</p>
<p>여기에 <code>axis</code>를 넣으면 <b>어느 방향으로 계산할지</b> 정해요. <b>교과서(학습자료 77~81쪽) 기준</b>으로 외우세요. 시험도 이 기준이에요.</p>
<div class="axis-fig">
 <div class="axf"><b>axis=0 → "행끼리" / "행별"</b><br>행(가로줄)들을 위아래로 겹쳐서 계산 ↓<br>결과 개수 = 열 개수 = <b>5개</b><br><span>"행끼리 최댓값", "행의 원소 합계"</span></div>
 <div class="axf"><b>axis=1 → "열끼리" / "열별"</b><br>열(세로줄)들을 옆으로 겹쳐서 계산 →<br>결과 개수 = 행 개수 = <b>3개</b><br><span>"열끼리 최댓값", "열의 원소 합계"</span></div>
</div>
<div class="tip"><b>외우는 법: 행렬 순서 = 행 0, 열 1.</b> "행"이 들어가면 <code>axis=0</code>, "열"이 들어가면 <code>axis=1</code>. axis를 안 쓰면 <b>전체</b>를 계산해요.</div>`,
 code: NP_A + `
print(np.sum(a))            # 전체 합계
print(np.sum(a, axis=0))    # 행끼리 합계 (5개)
print(np.sum(a, axis=1))    # 열끼리 합계 (3개)`, starter: NP_A + `\n`},
{ t:'mc', title:'axis 확인', q:'교과서 기준으로 <b>행끼리 원소 합계</b>(행의 원소 합계)를 구하려면?', opts:['np.sum(a, axis=0)','np.sum(a, axis=1)','np.sum(a)','np.sum(a, axis=3)'], ans:0, exp:'"행"이 들어가면 axis=0이에요 (행 0, 열 1). 3행 5열 배열이면 결과는 5개가 나와요. axis를 안 쓰면 전체 합계 1개.'},
{ t:'learn', title:'합계 · 평균 · 중앙값', body:`
<table class="cmp"><tr><th>구하는 것</th><th>교과서 방식 (추천)</th><th>이렇게 써도 됨</th></tr>
<tr><td>합계</td><td><code>np.sum(a, axis=0)</code></td><td><code>a.sum(axis=0)</code></td></tr>
<tr><td>평균</td><td><code>np.mean(a, axis=0)</code></td><td><code>a.mean(axis=0)</code></td></tr>
<tr><td>중앙값</td><td><code>np.median(a, axis=0)</code></td><td class="bad">없음 (<code>a.median()</code>은 오류)</td></tr></table>
<p>모양: <code>np.함수이름(배열, axis=번호)</code> — 괄호 안에 <b>배열 이름 a를 먼저</b>, 쉼표 다음에 axis.</p>
<div class="warn"><b>중앙값은 반드시 <code>np.median(a, axis=...)</code></b>. <code>a.median()</code>은 없어서 오류가 나요. 그래서 처음부터 전부 <code>np.</code> 방식으로 통일해서 외우는 게 안전해요.</div>
<p>중앙값: 크기 순으로 줄 세웠을 때 가운데 값. [1, 2, 3] → 2. 값이 짝수 개면 가운데 두 값의 평균이에요 ([1, 2, 3, 4] → 2.5).</p>`,
 code: NP_A + `
print(np.sum(a, axis=0))      # 행끼리 합계
print(np.mean(a, axis=1))     # 열끼리 평균
print(np.median(a, axis=0))   # 행끼리 중앙값`, starter: NP_A + `\n`},
{ t:'learn', title:'최댓값 · 최솟값 · 분산 · 표준편차', body:`
<table class="cmp"><tr><th>구하는 것</th><th>교과서 방식</th></tr>
<tr><td>최댓값</td><td><code>np.max(a, axis=0)</code></td></tr>
<tr><td>최솟값</td><td><code>np.min(a, axis=0)</code></td></tr>
<tr><td>분산</td><td><code>np.var(a, axis=1)</code></td></tr>
<tr><td>표준편차</td><td><code>np.std(a, axis=1)</code></td></tr></table>
<p><b>"행끼리 최댓값"</b> = 행들을 위아래로 겹쳐서 비교 → <code>axis=0</code> (결과 5개). <b>"열끼리"</b>면 <code>axis=1</code> (결과 3개).</p>
<p>분산은 값이 평균에서 얼마나 퍼져 있는지, 표준편차는 분산의 제곱근이에요.</p>
<div class="tip">영어 이름으로 외우기: max 최대, min 최소, var(variance) 분산, std(standard deviation) 표준편차. 모양은 전부 <code>np.이름(a, axis=번호)</code>로 똑같아요.</div>`,
 code: NP_A + `
print(np.max(a, axis=0))   # 행끼리 최댓값
print(np.min(a, axis=0))   # 행끼리 최솟값
print(np.var(a, axis=1))   # 열끼리 분산
print(np.std(a, axis=1))   # 열끼리 표준편차`, starter: NP_A + `\n`},
{ t:'learn', title:'조건 선별: any · all · where', body:`
<p><code>a &gt; 5</code>처럼 조건을 쓰면 칸마다 <b>True</b>(맞다) 또는 <b>False</b>(아니다)가 나와요. 예: 7 &gt; 5 → True, 3 &gt; 5 → False. 이 결과를 함수에 넣어요.</p>
<p class="dim">비교 기호: <code>&gt;</code> 크다, <code>&lt;</code> 작다, <code>&gt;=</code> 크거나 같다, <code>&lt;=</code> 작거나 같다, <code>==</code> 같다</p>
<table class="cmp"><tr><th>함수 (교과서 방식)</th><th>뜻</th><th>결과</th></tr>
<tr><td><code>np.any(a &gt; 5)</code></td><td>하나라도 맞으면 True</td><td>True 또는 False 1개</td></tr>
<tr><td><code>np.all(a &gt; 0)</code></td><td>전부 맞아야 True</td><td>True 또는 False 1개</td></tr>
<tr><td><code>np.where(a &gt; 3, a, 0)</code></td><td>조건이면 A, 아니면 B</td><td>원래 모양 그대로의 배열</td></tr></table>
<p><code>np.where(조건, 참일 때 값, 거짓일 때 값)</code> — 세 칸을 기억하세요. 배열 이름 <code>a</code>는 <b>조건 안에</b> 들어 있어요(<code>a &gt; 3</code>).</p>
<div class="warn"><code>a.where()</code>는 <b>없어요</b>(오류). where는 반드시 <code>np.where(...)</code>.</div>`,
 code: NP_A + `
print(a > 5)
print(np.any(a > 5))          # 5보다 큰 값이 하나라도 있나?
print(np.all(a > 0))          # 전부 0보다 큰가?
print(np.where(a > 3, a, 0))  # 3보다 크면 그대로, 아니면 0`, starter: NP_A + `\n`},
{ t:'code', title:'문제 1-A: 행의 합계 + 열의 중앙값', body:`<p>시험 배열 <code>a</code>를 만들고 <b>행의 원소 합계</b>와 <b>열의 중앙값</b>을 차례로 출력하세요. (교과서 기준 axis)</p>${NP_TABLE}`,
 ref: NP_A + `\nprint(np.sum(a, axis=0))\nprint(np.median(a, axis=1))`, ignore: NPIGN, check:'out', hints:['"행" → axis=0, "열" → axis=1','np.sum(a, axis=0)','np.median(a, axis=1)']},
{ t:'code', title:'문제 1-B: 열의 평균 + 행끼리 최솟값', body:`<p>시험 배열로 <b>열의 평균</b>과 <b>행끼리 최솟값</b>을 출력하세요.</p>${NP_TABLE}`,
 ref: NP_A + `\nprint(np.mean(a, axis=1))\nprint(np.min(a, axis=0))`, ignore: NPIGN, check:'out', hints:['"열" → axis=1, "행" → axis=0','np.mean(a, axis=1)','np.min(a, axis=0)']},
{ t:'code', title:'문제 1-C: 분산과 표준편차', body:`<p>시험 배열로 <b>행끼리 분산</b>과 <b>행끼리 표준편차</b>를 출력하세요.</p>${NP_TABLE}`,
 ref: NP_A + `\nprint(np.var(a, axis=0))\nprint(np.std(a, axis=0))`, ignore: NPIGN, check:'out', hints:['분산 var, 표준편차 std','"행끼리" → axis=0','np.var(a, axis=0) / np.std(a, axis=0)']},
{ t:'code', title:'문제 1-D: 조건 선별', body:`<p>시험 배열로 다음 세 가지를 차례로 출력하세요.</p><ol><li>6보다 큰 값이 <b>하나라도</b> 있는지 (any)</li><li>모든 값이 0보다 큰지 (all)</li><li>0보다 작은 값은 0으로 바꾸고 나머지는 그대로 둔 배열 (where)</li></ol>${NP_TABLE}`,
 ref: NP_A + `\nprint(np.any(a > 6))\nprint(np.all(a > 0))\nprint(np.where(a < 0, 0, a))`, ignore: NPIGN, check:'out', hints:['np.any(a > 6)','np.all(a > 0)','np.where(조건, 참일 때, 거짓일 때) → np.where(a < 0, 0, a)']},
{ t:'learn', title:'arange: 연속된 숫자 배열', body:`
<p><code>np.arange(시작, 끝, 간격)</code> — <b>끝 숫자는 포함하지 않아요.</b></p>
<table class="cmp"><tr><th>코드</th><th>결과</th></tr>
<tr><td><code>np.arange(1, 4)</code></td><td>[1 2 3]</td></tr>
<tr><td><code>np.arange(5)</code></td><td>[0 1 2 3 4] (시작을 안 쓰면 0부터)</td></tr>
<tr><td><code>np.arange(1, 7)</code></td><td>[1 2 3 4 5 6]</td></tr>
<tr><td><code>np.arange(0, 10, 2)</code></td><td>[0 2 4 6 8]</td></tr></table>
<div class="tip">1부터 3까지 → <code>np.arange(1, 4)</code>. "끝 + 1"을 쓴다고 외우세요.</div>`,
 code:`import numpy as np
print(np.arange(1, 4))
print(np.arange(1, 7))
print(np.arange(0, 10, 2))`},
{ t:'learn', title:'reshape: 모양 바꾸기', body:`
<p><code>배열.reshape(행, 열)</code> — 원소는 그대로, 모양만 바꿔요.</p>
<div class="shape-demo"><div class="row3"><i>1</i><i>2</i><i>3</i></div><span>reshape(3, 1) ⇒</span><div class="col3"><i>1</i><i>2</i><i>3</i></div></div>
<ul><li><b>행 × 열 = 원소 개수</b>가 맞아야 해요. 6개 → (2, 3) 또는 (3, 2) 가능, (4, 2)는 오류.</li>
<li><code>-1</code>은 "알아서 계산해" → <code>reshape(-1, 1)</code> = 세로 한 줄</li>
<li>arange와 이어서 한 줄로: <code>np.arange(1, 7).reshape(2, 3)</code></li></ul>`,
 code:`import numpy as np
a = np.arange(1, 4)
print(a)
b = a.reshape(3, 1)
print(b)
c = np.arange(1, 7).reshape(2, 3)
print(c)`},
{ t:'code', title:'문제 2: 차원 변경', body:`<p><code>arange()</code>로 [1 2 3] 배열을 만들어 출력한 뒤, <code>reshape()</code>로 <b>3행 1열</b>로 바꿔 출력하세요.</p>
<div class="shape-demo"><div class="row3"><i>1</i><i>2</i><i>3</i></div><span>⇒</span><div class="col3"><i>1</i><i>2</i><i>3</i></div></div>`,
 ref:`import numpy as np\na = np.arange(1, 4)\nprint(a)\nb = a.reshape(3, 1)\nprint(b)`, check:'out', must:[['arange','arange()를 써야 해요'],['reshape','reshape()를 써야 해요']], hints:['np.arange(1, 4) → [1 2 3]','a.reshape(3, 1)','두 번 print 하기']},
{ t:'type', title:'타자: 문제 2', target:`import numpy as np
a = np.arange(1, 4)
print(a)
b = a.reshape(3, 1)
print(b)`},
{ t:'learn', title:'배열 연산', body:`
<p>모양이 같은 두 배열은 <b>같은 자리끼리</b> 계산돼요. 숫자 하나와 계산하면 <b>모든 칸</b>에 적용돼요.</p>
<table class="cmp"><tr><th>코드</th><th>뜻</th></tr>
<tr><td><code>a + b</code>, <code>a - b</code></td><td>같은 자리끼리 더하기/빼기</td></tr>
<tr><td><code>a * b</code>, <code>a / b</code></td><td>같은 자리끼리 곱하기/나누기</td></tr>
<tr><td><code>a * 2</code>, <code>a + 10</code></td><td>모든 칸에 적용</td></tr>
<tr><td><code>a ** 2</code></td><td>모든 칸 제곱</td></tr></table>
<p><b>모양이 달라도 되는 경우 (브로드캐스팅, 교과서 84~85쪽)</b>: 한 줄짜리 배열은 모자란 줄만큼 <b>복사돼서</b> 계산돼요.</p>
<pre class="code">np.arange(9).reshape(3, 3) + np.arange(3)
# [[0 1 2]      [0 1 2]      [[0 2 4]
#  [3 4 5]   +  [0 1 2]   =   [3 5 7]
#  [6 7 8]]     [0 1 2]       [6 8 10]]</pre>
<div class="tip">시험 3번은 <b>결과를 보고 거꾸로</b> 코드를 쓰는 문제예요. 시험지에는 결과 칸이 비어 있어서, 실제 결과는 시험 때 선생님이 줄 거예요. 결과의 모양(몇 행 몇 열)과 숫자 규칙을 먼저 찾으세요.</div>`,
 code:`import numpy as np
a = np.arange(1, 7).reshape(2, 3)
b = np.arange(7, 13).reshape(2, 3)
print(a)
print(b)
print(a + b)
print(a * 2)
print(a ** 2)
print(np.arange(9).reshape(3, 3) + np.arange(3))`},
{ t:'code', title:'문제 3-A: 결과 보고 코드 쓰기', body:`<p><code>arange()</code>와 <code>reshape()</code>로 배열 두 개를 만들고, 오른쪽 <b>목표 출력</b>이 나오도록 코드를 쓰세요.</p><p class="dim">힌트: 1~6과 7~12로 만든 2행 3열 배열 두 개</p>`,
 ref:`import numpy as np\na = np.arange(1, 7).reshape(2, 3)\nb = np.arange(7, 13).reshape(2, 3)\nprint(a + b)`, check:'out', showExpected:true, must:[['arange','arange()를 써야 해요'],['reshape','reshape()를 써야 해요']], hints:['결과가 2행 3열 → reshape(2, 3)','a = 1~6, b = 7~12','print(a + b)']},
{ t:'code', title:'문제 3-B: 결과 보고 코드 쓰기', body:`<p>오른쪽 <b>목표 출력</b>이 나오도록 <code>arange()</code>, <code>reshape()</code>를 써서 코드를 작성하세요.</p>`,
 ref:`import numpy as np\na = np.arange(1, 10).reshape(3, 3)\nprint(a * 10)`, check:'out', showExpected:true, must:[['arange','arange()를 써야 해요'],['reshape','reshape()를 써야 해요']], hints:['3행 3열 → 원소 9개 → arange(1, 10)','모든 칸이 10배','print(a * 10)']},
{ t:'code', title:'백지 테스트: 넘파이', blank:true, body:`<p><b>아무것도 보지 말고</b> 처음부터 쓰세요. 시험 배열을 만들고 <b>행의 중앙값</b>과 <b>열끼리 최댓값</b>을 출력하세요.</p>${NP_TABLE}`,
 ref: NP_A + `\nprint(np.median(a, axis=0))\nprint(np.max(a, axis=1))`, ignore: NPIGN, check:'out', hints:['import numpy as np','"행" → axis=0, "열" → axis=1','np.median(a, axis=0) / np.max(a, axis=1)']},
{ t:'quiz', title:'서술: 넘파이 설명', q:'넘파이(NumPy) 라이브러리를 설명하시오.', kw:['배열','수치|계산','빠르','통계|합계|평균','판다스|기반'], answer: DESC_NP},
]},

/* ================= CH3 판다스 ================= */
{ id:'c3', title:'판다스', short:'PANDAS', mins:52, steps:[
{ t:'intro', title:'판다스 pandas', body:`<p class="lead">판다스는 <b>1번(데이터프레임 만들기)</b>은 무조건, <b>2~13번 중 5개</b>가 나와요. 그래서 12개 전부 연습해요.</p>${FAMILY_TABLE}
<ul class="goals"><li>시리즈와 데이터프레임</li><li>딕셔너리 · 배열 · 시리즈로 만들기</li><li>추출 <code>[[ ]]</code>, <code>loc</code></li><li>추가 · 수정 · 이름 변경 · 전치 · 삭제 · 인덱스 변경</li></ul>`},
{ t:'learn', title:'판다스란? (설명 외우기)', body:`
<div class="answer">${DESC_PD}</div>
<p class="kw">핵심 단어: <span>표 형태(행과 열)</span><span>시리즈(1차원)</span><span>데이터프레임(2차원)</span><span>추출·추가·수정·삭제</span><span>넘파이 기반</span></p>
<p>용어: <b>인덱스(index)</b> = 행 이름 (grandpa, grandma …), <b>칼럼(column)</b> = 열 이름 (age, weight …)</p>`},
{ t:'learn', title:'시리즈 Series: 이름표 달린 한 줄', body:`
<p><code>pd.Series(값 리스트, index=이름 리스트)</code> — 값 하나하나에 이름(인덱스)이 붙어요.</p>
<p>데이터프레임의 <b>열 하나</b>(또는 행 하나)가 바로 시리즈예요. 출력 끝의 <code>dtype: int64</code>는 값의 종류(정수) 표시예요. 시험 답에는 안 써요.</p>
<p><b>용어</b>: <b>인덱스(index)</b> = 행 이름 (grandpa, grandma …), <b>칼럼(column)</b> = 열 이름 (age, weight …). 판다스 문제에 계속 나와요.</p>
<p><b>판다스</b>는 이렇게 이름 붙은 표 데이터를 다루는 라이브러리예요. 한 줄짜리는 <b>시리즈</b>, 표 전체는 <b>데이터프레임</b>이라고 불러요.</p>
<div class="warn"><code>Series</code>, <code>DataFrame</code>은 <b>대문자</b>로 시작해요. <code>pd.series</code>는 오류!</div>`,
 code:`import pandas as pd
age = pd.Series([60, 70, 12, 45, 42],
                index=['grandpa', 'grandma', 'grandson', 'papa', 'mama'])
print(age)
print(age['papa'])`},
{ t:'learn', title:'방법 ① 딕셔너리로 만들기 (추천)', body:`
<p>시험 1번은 세 가지 방법 중 <b>1개 선택</b>이에요. 가장 쉽고 실수가 적은 <b>딕셔너리 방법</b>을 기본으로 외우세요. 아래 표를 만드는 코드를 한 줄씩 볼게요.</p>
${FAMILY_TABLE}
<pre class="code">import pandas as pd                              # ① 판다스 도구 상자, 별명 pd
data = {'age': [60, 70, 12, 45, 42],             # ② 칼럼 이름: [그 칼럼의 값 5개]
        'weight': [3.8, 7.2, 6.3, 5.5, 4.6],
        'height': [4.4, 5.6, 6.4, 5.7, 7.8],
        'nickname': ['Shark', 'Audrey', 'Smurf', 'Tongk', 'JJ']}
df = pd.DataFrame(data, index=['grandpa', 'grandma', 'grandson', 'papa', 'mama'])   # ③ 표 만들기
print(df)                                        # ④ 화면에 표 보여주기</pre>
<table class="cmp"><tr><th>줄</th><th>뜻</th></tr>
<tr><td>① <code>import pandas as pd</code></td><td>판다스를 불러와서 <code>pd</code>라고 부를게. 없으면 <code>pd</code>를 몰라서 오류.</td></tr>
<tr><td>② <code>data = { ... }</code></td><td>딕셔너리. <b>키 = 칼럼(열) 이름</b>, <b>값 리스트 = 그 칼럼을 위에서 아래로</b> 읽은 값. <code>'age': [60, 70, 12, 45, 42]</code> → 표의 age 세로줄. 리스트마다 값이 <b>5개</b>(행 수)로 같아야 해요.</td></tr>
<tr><td>③ <code>pd.DataFrame(data, index=[...])</code></td><td><code>DataFrame</code>(대문자 D, F)은 <b>표를 만드는 함수</b>. 첫 재료 <code>data</code>로 칼럼을 만들고, <code>index=</code>에 준 리스트가 <b>왼쪽 행 이름(인덱스)</b>이 돼요. 순서는 값 리스트 순서와 같아야 해요(60이 grandpa). 만든 표는 <code>df</code>라는 상자에 넣어요.</td></tr>
<tr><td>④ <code>print(df)</code></td><td>Thonny는 print를 해야 보여요. 표 전체가 출력돼요.</td></tr></table>
<div class="tip"><code>index=</code>를 빼면 행 이름이 <b>0, 1, 2, 3, 4</b> 번호로 붙어요. 시험 표처럼 grandpa… 이름을 붙이려면 꼭 써야 해요. (교과서처럼 <code>pd.DataFrame(data, ['grandpa', ...])</code>로 <code>index=</code> 글자를 생략해도 돼요)</div>`,
 code: DF_DICT + `\nprint(df)`},
{ t:'code', title:'문제 1: 딕셔너리로 데이터프레임', body:`<p>딕셔너리를 이용해 아래 데이터프레임을 만들고 출력하세요.</p>${FAMILY_TABLE}`,
 ref: DF_DICT + `\nprint(df)`, check:'out', must:[['\\{','딕셔너리 { }를 써야 해요']], hints:["data = {'age': [60, 70, 12, 45, 42], ...}","df = pd.DataFrame(data, index=[...])","index에 행 이름 5개, 마지막에 print(df)"]},
{ t:'type', title:'타자: 딕셔너리 데이터프레임 (가장 중요)', target: DF_DICT + `\nprint(df)`},
{ t:'learn', title:'방법 ② 배열(2차원 리스트)로 만들기', body:`
<p>표를 <b>행 단위</b>로 그대로 옮겨요. 이때는 열 이름도 따로 줘야 해요. (<code>index=</code>, <code>columns=</code>는 생략하고 순서대로 줘도 돼요: <code>pd.DataFrame(arr, [행 이름], [열 이름])</code>)</p>
<pre class="code">pd.DataFrame(2차원 리스트, index=[행 이름], columns=[열 이름])</pre>
<div class="warn">숫자와 문자가 섞인 데이터를 <code>np.array()</code>로 감싸면 <b>숫자까지 전부 문자</b>가 돼요. 그래서 그냥 2차원 리스트를 넣는 게 안전해요.</div>`,
 code: DF_ARR + `\nprint(df)`},
{ t:'learn', title:'방법 ③ 시리즈로 만들기', body:`
<p><b>교과서 방식</b>(93~94쪽): <b>행마다</b> 시리즈를 하나씩 만들고(시리즈의 index = 열 이름), 그 시리즈들을 <b>리스트</b>로 넣어요.</p>
<pre class="code">pd.DataFrame([시리즈1, 시리즈2, ...], index=[행 이름])</pre>
<p>열 이름 리스트를 <code>col</code> 변수로 만들어 두면 덜 쓸 수 있어요.</p>`,
 code: DF_SER + `\nprint(df)`},
{ t:'code', title:'문제 1 변형: 배열로 만들기', body:`<p>이번엔 <b>2차원 배열(리스트)</b> 방법으로 같은 데이터프레임을 만들고 출력하세요. (열 이름도 따로 줘야 해요)</p>${FAMILY_TABLE}`,
 ref: DF_ARR + `\nprint(df)`, check:'out', must:[['\\[\\s*\\[','2차원 리스트 [[...], [...]]로 만들어야 해요']], hints:['행 하나 = [60, 3.8, 4.4, \'Shark\']','pd.DataFrame(arr, index=[...], columns=[...])']},
{ t:'code', title:'문제 1 변형: 시리즈로 만들기', body:`<p><b>시리즈</b> 방법으로 같은 데이터프레임을 만들고 출력하세요.</p>${FAMILY_TABLE}`,
 ref: DF_SER + `\nprint(df)`, check:'out', must:[['Series','pd.Series를 써야 해요']], hints:['col = [\'age\', \'weight\', \'height\', \'nickname\']','행마다 a = pd.Series([60, 3.8, 4.4, \'Shark\'], index=col) … 5개','pd.DataFrame([a, b, c, d, e], index=[...])']},
{ t:'learn', title:'열 추출: 대괄호 두 겹', body:`
<table class="cmp"><tr><th>코드</th><th>결과</th></tr>
<tr><td><code>df['age']</code></td><td>열 1개 → 시리즈</td></tr>
<tr><td><code>df[['height', 'nickname']]</code></td><td>열 여러 개 → 데이터프레임</td></tr></table>
<div class="warn">열 여러 개는 <b>대괄호 두 겹</b> <code>[[ ]]</code>! 바깥은 "뽑아라", 안쪽은 "이름 리스트"예요.</div>`,
 code: DF_DICT + `\nprint(df['age'])\nprint(df[['height', 'nickname']])`, starter: DF_DICT + `\n`},
{ t:'code', title:'문제 2: 열 2개 추출', body:`<p>데이터프레임의 <b>height, nickname</b> 2개 칼럼을 추출해 출력하세요. (데이터프레임 만드는 코드는 미리 넣어 뒀어요)</p>`,
 starter: DF_DICT + `\n\n`, ref: DF_DICT + `\nprint(df[['height', 'nickname']])`, check:'out', lenient:true, hints:['대괄호 두 겹','print(df[[\'height\', \'nickname\']])']},
{ t:'learn', title:'행 추출: loc', body:`
<p>행은 <code>df.loc[ ]</code>로 뽑아요. (<b>loc</b> = location, 이름으로 찾기)</p>
<table class="cmp"><tr><th>코드</th><th>뜻</th></tr>
<tr><td><code>df.loc['papa']</code></td><td>행 1개</td></tr>
<tr><td><code>df.loc[['grandma', 'grandson', 'papa']]</code></td><td>행 여러 개 (두 겹)</td></tr>
<tr><td><code>df.loc['grandma':'papa']</code></td><td>grandma부터 papa까지 (<b>끝 포함</b>)</td></tr>
<tr><td><code>df.iloc[1:4]</code></td><td>(참고) 번호로: 1, 2, 3번 행 (끝 미포함)</td></tr></table>
<div class="tip">교과서(97쪽)는 grandma~papa를 <code>df.loc['grandma':'papa']</code>로 뽑아요. 리스트 방식과 결과가 같아요.</div>`,
 code: DF_DICT + `\nprint(df.loc[['grandma', 'grandson', 'papa']])\nprint(df.loc['grandma':'papa'])`, starter: DF_DICT + `\n`},
{ t:'code', title:'문제 3: 행 3개 추출', body:`<p><b>grandma, grandson, papa</b> 3개 인덱스에 해당하는 행을 추출해 출력하세요.</p>`,
 starter: DF_DICT + `\n\n`, ref: DF_DICT + `\nprint(df.loc[['grandma', 'grandson', 'papa']])`, check:'out', lenient:true, hints:['행은 loc','df.loc[[\'grandma\', \'grandson\', \'papa\']] 또는 교과서처럼 df.loc[\'grandma\':\'papa\']']},
{ t:'learn', title:'행과 열 함께 지정', body:`
<p><code>df.loc[행, 열]</code> — 쉼표 앞이 행, 뒤가 열이에요.</p>
<pre class="code">df.loc[['grandma', 'grandson'], ['weight', 'height']]
df.loc['grandma':'grandson', 'weight':'height']   # 범위로도 가능</pre>
<div class="tip">순서 기억: <b>행 먼저, 열 나중</b>. "loc[누구, 무엇]"</div>`,
 code: DF_DICT + `\nprint(df.loc[['grandma', 'grandson'], ['weight', 'height']])`, starter: DF_DICT + `\n`},
{ t:'code', title:'문제 4: 행과 열 지정 추출', body:`<p><b>grandma, grandson</b> 행의 <b>weight, height</b> 열만 추출해 출력하세요.</p>`,
 starter: DF_DICT + `\n\n`, ref: DF_DICT + `\nprint(df.loc[['grandma', 'grandson'], ['weight', 'height']])`, check:'out', lenient:true, hints:['df.loc[행 리스트, 열 리스트]','df.loc[[\'grandma\', \'grandson\'], [\'weight\', \'height\']]']},
{ t:'learn', title:'열 추가: 맨 끝 / 맨 앞', body:`
<table class="cmp"><tr><th>위치</th><th>코드</th></tr>
<tr><td>맨 끝 (문제 5)</td><td><code>df['sex'] = ['M', 'F', 'M', 'M', 'F']</code></td></tr>
<tr><td>맨 앞 (문제 6)</td><td><code>df.insert(0, 'sex', ['M', 'F', 'M', 'M', 'F'])</code></td></tr></table>
<p><code>insert(위치 번호, '열 이름', 값)</code> — 위치 0이 맨 앞이에요.</p>
<div class="warn">값 개수는 행 개수(5개)와 같아야 해요. 다르면 <code>ValueError: Length of values</code> 오류.</div>`,
 code: DF_DICT + `\ndf['sex'] = ['M', 'F', 'M', 'M', 'F']\nprint(df)`, starter: DF_DICT + `\n`},
{ t:'code', title:'문제 5: 마지막 칼럼에 추가', body:`<p><b>sex</b> 칼럼(M, F, M, M, F)을 <b>마지막</b>에 추가하고 출력하세요.</p>`,
 starter: DF_DICT + `\n\n`, ref: DF_DICT + `\ndf['sex'] = ['M', 'F', 'M', 'M', 'F']\nprint(df)`, check:'out', lenient:true, hints:["df['새 열 이름'] = [값 5개]","df['sex'] = ['M', 'F', 'M', 'M', 'F']"]},
{ t:'code', title:'문제 6: 제일 앞에 추가', body:`<p><b>sex</b> 칼럼(M, F, M, M, F)을 <b>제일 앞</b>에 추가하고 출력하세요.</p>`,
 starter: DF_DICT + `\n\n`, ref: DF_DICT + `\ndf.insert(0, 'sex', ['M', 'F', 'M', 'M', 'F'])\nprint(df)`, check:'out', lenient:true, hints:['insert(위치, 이름, 값)','df.insert(0, \'sex\', [...])']},
{ t:'learn', title:'행 추가 · 행 값 바꾸기', body:`
<table class="cmp"><tr><th>할 일</th><th>코드</th></tr>
<tr><td>새 행 추가 (문제 7)</td><td><code>df.loc['uncle'] = [33, 8.2, 7.0, 'DOC']</code></td></tr>
<tr><td>그 행 전부 0 (문제 8)</td><td><code>df.loc['uncle'] = 0</code></td></tr></table>
<p>없는 이름으로 <code>loc</code>에 값을 넣으면 <b>새 행</b>이 생기고, 있는 이름이면 <b>값이 바뀌어요</b>.</p>`,
 code: DF_DICT + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\nprint(df)\ndf.loc['uncle'] = 0\nprint(df)`, starter: DF_DICT + `\n`},
{ t:'code', title:'문제 7: 새 인덱스 행 추가', body:`<p><b>uncle</b> 행 (age 33, weight 8.2, height 7.0, nickname DOC)을 추가하고 출력하세요.</p>`,
 starter: DF_DICT + `\n\n`, ref: DF_DICT + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\nprint(df)`, check:'out', lenient:true, hints:['df.loc[\'새 행 이름\'] = [값 4개]']},
{ t:'code', title:'문제 8: uncle 값을 모두 0으로', body:`<p>uncle 행을 추가한 다음, uncle 행의 값을 <b>모두 0</b>으로 바꾸고 출력하세요.</p>`,
 starter: DF_DICT + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\n\n`, ref: DF_DICT + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\ndf.loc['uncle'] = 0\nprint(df)`, check:'out', lenient:true, hints:['df.loc[\'uncle\'] = 0']},
{ t:'learn', title:'칸 하나 / 여러 칸 값 바꾸기', body:`
<p><code>df.loc[행, 열] = 새 값</code></p>
<pre class="code">df.loc['grandma', 'age'] = 71
df.loc['grandson', ['weight', 'height']] = [6.0, 6.2]
df.loc['papa', 'weight'] = 5.7
# 교과서(101쪽) 방식: 여러 행·열을 한 줄로
df.loc[['grandson', 'papa'], ['weight', 'height']] = [[6.0, 6.2], [5.7, 5.4]]</pre>
<p>문제 9는 표의 <b>빨간/파란 네모 칸</b>이 바뀐 거예요. 전과 후를 비교해서 바뀐 칸만 찾으면 돼요.</p>`,
 code: DF_DICT + `\ndf.loc['grandma', 'age'] = 71\ndf.loc['grandson', ['weight', 'height']] = [6.0, 6.2]\nprint(df)`, starter: DF_DICT + `\n`},
{ t:'code', title:'문제 9: 칼럼 값 변경', body:`<p>아래처럼 값을 바꾸고 출력하세요.</p><ul><li>grandma age: 70 → <b>71</b></li><li>grandson weight 6.3 → <b>6.0</b>, height 6.4 → <b>6.2</b></li><li>papa weight 5.5 → <b>5.7</b>, height 5.7 → <b>5.4</b></li></ul>`,
 starter: DF_DICT + `\ndf.loc['uncle'] = 0\n\n`, ref: DF_DICT + `\ndf.loc['uncle'] = 0\ndf.loc['grandma', 'age'] = 71\ndf.loc['grandson', ['weight', 'height']] = [6.0, 6.2]\ndf.loc['papa', ['weight', 'height']] = [5.7, 5.4]\nprint(df)`, check:'out', lenient:true, hints:['df.loc[행, 열] = 값','grandson과 papa는 열 두 개를 리스트로','교과서 한 줄 방식: df.loc[[\'grandson\', \'papa\'], [\'weight\', \'height\']] = [[6.0, 6.2], [5.7, 5.4]]']},
{ t:'learn', title:'인덱스명 · 칼럼명 바꾸기: rename', body:`
<pre class="code">df = df.rename(index={'grandpa': 'GP', 'grandma': 'GM'})
df = df.rename(columns={'age': 'A', 'weight': 'W'})</pre>
<p><code>{'원래 이름': '새 이름'}</code> 딕셔너리로 줘요.</p>
<div class="warn"><code>rename</code>은 <b>바뀐 복사본</b>을 돌려줘요. <code>df = df.rename(...)</code>으로 다시 저장하거나 <code>inplace=True</code>를 써야 원본이 바뀌어요.</div>
<p>교과서(101~102쪽) 방식: <code>df.rename(index={...}, inplace=True)</code> → 원본이 바로 바뀌어요.</p>
<p>한꺼번에 바꾸는 다른 방법: <code>df.index = ['GP', 'GM', 'GS', 'PP', 'MM']</code>, <code>df.columns = ['A', 'W', 'H', 'N']</code></p>`,
 code: DF_DICT + `\ndf2 = df.rename(index={'grandpa': 'GP', 'grandma': 'GM', 'grandson': 'GS', 'papa': 'PP', 'mama': 'MM'})\nprint(df2)\ndf3 = df.rename(columns={'age': 'A', 'weight': 'W', 'height': 'H', 'nickname': 'N'})\nprint(df3)`, starter: DF_DICT + `\n`},
{ t:'code', title:'문제 10: 인덱스명과 칼럼명 변경', body:`<p>시험지 3쪽처럼 9번까지 값이 바뀌고 uncle 행이 있는 데이터프레임에서</p><ol><li>인덱스명을 GP, GM, GS, PP, MM, UC로 바꾼 결과를 출력하고</li><li>칼럼명을 A, W, H, N으로 바꾼 결과를 출력하세요.</li></ol><p class="dim">두 결과를 각각 따로 출력해도 되고, 교과서처럼 <code>inplace=True</code>로 차례로 바꾸며 출력해도 정답이에요. (시험지 두 표의 uncle 값이 서로 다른 건 시험지 쪽 차이예요)</p>`,
 starter: DF_DICT + `\n` + ST9 + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\n\n`, lenient:true,
 alt:[DF_DICT + `\n` + ST9 + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\ndf.rename(index={'grandpa': 'GP', 'grandma': 'GM', 'grandson': 'GS', 'papa': 'PP', 'mama': 'MM', 'uncle': 'UC'}, inplace=True)\nprint(df)\ndf.rename(columns={'age': 'A', 'weight': 'W', 'height': 'H', 'nickname': 'N'}, inplace=True)\nprint(df)`],
 ref: DF_DICT + `\n` + ST9 + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\nprint(df.rename(index={'grandpa': 'GP', 'grandma': 'GM', 'grandson': 'GS', 'papa': 'PP', 'mama': 'MM', 'uncle': 'UC'}))\nprint(df.rename(columns={'age': 'A', 'weight': 'W', 'height': 'H', 'nickname': 'N'}))`, check:'out', hints:['rename(index={...}) 결과를 print','rename(columns={...}) 결과를 print','교과서 방식: df.rename(index={...}, inplace=True) → print(df) → df.rename(columns={...}, inplace=True) → print(df)']},
{ t:'learn', title:'전치: 행과 열 맞바꾸기', body:`
<p><code>df.transpose()</code> (교과서 103쪽) 또는 줄여서 <code>df.T</code> — 인덱스가 열 이름이 되고, 열 이름이 인덱스가 돼요.</p>
<div class="tip">transpose = 전치. <code>.T</code>는 괄호 없이 써요.</div>`,
 code: DF_DICT + `\nprint(df.T)`, starter: DF_DICT + `\n`},
{ t:'code', title:'문제 11: 인덱스와 칼럼 맞바꾸기', body:`<p>데이터프레임의 인덱스와 칼럼을 맞바꿔 출력하세요.</p>`,
 starter: DF_DICT + `\n\n`, ref: DF_DICT + `\nprint(df.transpose())`, check:'out', lenient:true, hints:['print(df.transpose())','또는 print(df.T)']},
{ t:'learn', title:'삭제: drop', body:`
<table class="cmp"><tr><th>할 일</th><th>코드</th></tr>
<tr><td>행 삭제 (교과서)</td><td><code>df.drop('uncle', axis=0, inplace=True)</code></td></tr>
<tr><td>열 삭제 (교과서)</td><td><code>df.drop('nickname', axis=1, inplace=True)</code></td></tr>
<tr><td>다른 방법</td><td><code>df = df.drop('uncle')</code> / <code>df = df.drop(columns='nickname')</code></td></tr>
<tr><td>한 번에</td><td><code>df.drop(index='uncle', columns='nickname')</code></td></tr></table>
<div class="warn">열을 지울 때 <code>axis=1</code>을 빼면 행에서 'nickname'을 찾다가 <code>KeyError</code>가 나요. 넘파이와 같은 규칙: <b>행 → axis=0, 열 → axis=1</b>. <code>inplace=True</code>를 안 쓰면 <code>df = df.drop(...)</code>으로 저장해야 원본이 바뀌어요.</div>`,
 code: DF_DICT + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\ndf = df.drop('uncle')\ndf = df.drop('nickname', axis=1)\nprint(df)`, starter: DF_DICT + `\n`},
{ t:'code', title:'문제 12: uncle 행과 nickname 열 삭제', body:`<p>시험지 3쪽처럼 9번까지 값이 바뀌고 uncle 행이 있는 데이터프레임에서 <b>uncle 인덱스</b>와 <b>nickname 칼럼</b>을 삭제하고 출력하세요.</p>`,
 starter: DF_DICT + `\n` + ST9 + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\n\n`, ref: DF_DICT + `\n` + ST9 + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\ndf.drop('uncle', axis=0, inplace=True)\ndf.drop('nickname', axis=1, inplace=True)\nprint(df)`, check:'out', lenient:true, hints:['교과서: df.drop(\'uncle\', axis=0, inplace=True)','df.drop(\'nickname\', axis=1, inplace=True)','inplace 없이 쓰면 df = df.drop(...)로 저장']},
{ t:'learn', title:'인덱스를 열로 바꾸기: set_index', body:`
<pre class="code">df.set_index('nickname', inplace=True)</pre>
<ul><li>nickname 열이 인덱스(행 이름)가 되고, <b>기존 인덱스(grandpa …)는 삭제</b>돼요.</li>
<li><code>inplace=True</code>: <b>원본을 직접</b> 바꿔요. 안 쓰면 바뀐 <b>복사본</b>만 만들고 원본은 그대로예요.</li>
<li>같은 효과: <code>df = df.set_index('nickname')</code></li></ul>`,
 code: DF_DICT + `\ndf.set_index('nickname', inplace=True)\nprint(df)`, starter: DF_DICT + `\n`},
{ t:'code', title:'문제 13: 인덱스를 nickname으로', body:`<p>시험지 3쪽처럼 9번까지 값이 바뀌고 uncle 행이 0인 데이터프레임에서, 인덱스를 <b>nickname</b> 칼럼으로 바꾸고 출력하세요. (원본이 바뀌어야 해요)</p><p class="dim">결과 맨 아래 <code>0</code> 행은 uncle이에요. uncle의 nickname이 0이라서 인덱스가 0이 돼요. 시험지 결과와 같아요.</p>`,
 starter: DF_DICT + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\ndf.loc['uncle'] = 0\n` + ST9 + `\n\n`, ref: DF_DICT + `\ndf.loc['uncle'] = [33, 8.2, 7.0, 'DOC']\ndf.loc['uncle'] = 0\n` + ST9 + `\ndf.set_index('nickname', inplace=True)\nprint(df)`, check:'out', lenient:true, must:[['inplace\\s*=\\s*True|df\\s*=\\s*df\\.set_index','원본이 바뀌어야 해요: inplace=True 또는 df = df.set_index(...)']], hints:['set_index(\'nickname\', inplace=True)']},
{ t:'quiz', title:'서술: inplace=True', q:'df.set_index(\'nickname\', inplace=True)에서 inplace=True의 의미와, 쓰지 않으면 어떻게 되는지 설명하시오.', kw:['원본','복사본|사본','반영|바뀌|변경'], answer:'inplace=True로 설정하면 원본 데이터프레임이 직접 바뀐다. 설정하지 않으면 원본의 복사본을 새로 만들어 돌려주기 때문에 원본에는 반영되지 않는다. 이때 기존 인덱스는 삭제된다.'},

{ t:'learn', title:'판다스 정리노트 (시험 직전용)', body:`
<p>판다스 명령을 <b>시험 번호 순서</b>로 한 장에 모았어요. 시작은 항상 이 코드예요.</p>
<pre class="code">import pandas as pd
data = {'age': [60, 70, 12, 45, 42], 'weight': [3.8, 7.2, 6.3, 5.5, 4.6],
        'height': [4.4, 5.6, 6.4, 5.7, 7.8], 'nickname': ['Shark', 'Audrey', 'Smurf', 'Tongk', 'JJ']}
df = pd.DataFrame(data, index=['grandpa', 'grandma', 'grandson', 'papa', 'mama'])
print(df)</pre>
<table class="cmp"><tr><th>번호</th><th>할 일</th><th>코드</th></tr>
<tr><td>1</td><td>만들기 (딕셔너리)</td><td><code>pd.DataFrame(딕셔너리, index=[행 이름])</code></td></tr>
<tr><td>2</td><td>열 2개 뽑기</td><td><code>df[['height', 'nickname']]</code> ← 대괄호 두 겹</td></tr>
<tr><td>3</td><td>행 3개 뽑기</td><td><code>df.loc[['grandma', 'grandson', 'papa']]</code> 또는 <code>df.loc['grandma':'papa']</code></td></tr>
<tr><td>4</td><td>행+열 뽑기</td><td><code>df.loc[['grandma', 'grandson'], ['weight', 'height']]</code> ← [행, 열]</td></tr>
<tr><td>5</td><td>열 맨 끝 추가</td><td><code>df['sex'] = ['M', 'F', 'M', 'M', 'F']</code></td></tr>
<tr><td>6</td><td>열 맨 앞 추가</td><td><code>df.insert(0, 'sex', ['M', 'F', 'M', 'M', 'F'])</code> ← (위치, 이름, 값)</td></tr>
<tr><td>7</td><td>행 추가 (맨 아래)</td><td><code>df.loc['uncle'] = [33, 8.2, 7.0, 'DOC']</code></td></tr>
<tr><td>8</td><td>그 행 전부 0</td><td><code>df.loc['uncle'] = 0</code></td></tr>
<tr><td>9</td><td>칸 값 바꾸기</td><td><code>df.loc['grandma', 'age'] = 71</code><br><code>df.loc[['grandson', 'papa'], ['weight', 'height']] = [[6.0, 6.2], [5.7, 5.4]]</code></td></tr>
<tr><td>10</td><td>인덱스명·칼럼명 바꾸기</td><td><code>df.rename(index={'grandpa': 'GP', ...})</code><br><code>df.rename(columns={'age': 'A', ...})</code></td></tr>
<tr><td>11</td><td>행·열 맞바꾸기</td><td><code>df.transpose()</code> 또는 <code>df.T</code></td></tr>
<tr><td>12</td><td>행·열 삭제</td><td><code>df.drop('uncle', axis=0, inplace=True)</code><br><code>df.drop('nickname', axis=1, inplace=True)</code></td></tr>
<tr><td>13</td><td>인덱스를 칼럼으로</td><td><code>df.set_index('nickname', inplace=True)</code></td></tr></table>
<p><b>헷갈리는 짝</b></p>
<table class="cmp"><tr><th>이것</th><th>vs</th><th>저것</th></tr>
<tr><td><code>df['age']</code> 열 1개</td><td>|</td><td><code>df[['age', 'weight']]</code> 열 여러 개 (두 겹)</td></tr>
<tr><td><code>df['sex'] = ...</code> 열 추가 (맨 끝)</td><td>|</td><td><code>df.loc['uncle'] = ...</code> 행 추가 (맨 아래)</td></tr>
<tr><td><code>df.insert(0, ...)</code> 열만 가능</td><td>|</td><td>행은 <code>loc</code>만</td></tr>
<tr><td><code>axis=0</code> = 행 (인덱스)</td><td>|</td><td><code>axis=1</code> = 열 (칼럼)</td></tr>
<tr><td><code>rename(index=)</code> 행 이름</td><td>|</td><td><code>rename(columns=)</code> 열 이름</td></tr>
<tr><td><code>inplace=True</code> → 원본 바뀜</td><td>|</td><td>안 쓰면 → <code>df = df.drop(...)</code>처럼 다시 저장</td></tr></table>
<div class="tip">값 개수 규칙: <b>열</b>을 추가할 땐 값이 <b>행 수(5개)</b>, <b>행</b>을 추가할 땐 값이 <b>열 수(4개)</b>만큼. 결과는 꼭 <code>print(df)</code>.</div>`}]},

{ id:'c4', title:'맷플롯립', short:'GRAPH', mins:20, steps:[
{ t:'intro', title:'맷플롯립 Matplotlib', body:`<p class="lead">시험 그래프는 <b>사진 속 가족 몸무게 그래프 1개</b>예요. 단, <b>마커·색·선 종류가 바뀌어 나올 수 있으니</b> 옵션표를 확실히 외워요.</p>
<div class="photo-cond"><b>&lt;작성 조건&gt;</b> 마커: ★, 그래프 색상: 마젠타(m), 선 종류: -- · 범례(label='weight')</div>
<ul class="goals"><li>plot의 기본 구조</li><li>marker · color · linestyle 옵션표</li><li>xlabel · ylabel · label · legend · show</li></ul>`},
{ t:'learn', title:'맷플롯립이란? (설명 외우기)', body:`<div class="answer">${DESC_MPL}</div>
<p class="kw">핵심 단어: <span>시각화</span><span>선 그래프·막대·산점도·원그래프</span><span>pyplot → plt</span></p>`},
{ t:'learn', title:'그래프의 기본 4단계', body:`
<ol><li><b>불러오기</b>: <code>import matplotlib.pyplot as plt</code> (시험지 4쪽처럼 <code>from matplotlib import pyplot as plt</code>로 써도 같아요)</li>
<li><b>데이터</b>: <code>x</code> 리스트(가로축), <code>y</code> 리스트(세로축) — 개수가 같아야 해요</li>
<li><b>그리기</b>: <code>plt.plot(x, y)</code></li>
<li><b>보여주기</b>: <code>plt.show()</code> ← Thonny에서 이게 없으면 그래프 창이 안 떠요</li></ol>`,
 code:`import matplotlib.pyplot as plt
x = ['grandpa', 'grandma', 'grandson', 'papa', 'mama']
y = [3.8, 7.2, 6.3, 5.5, 4.6]
plt.plot(x, y)
plt.show()`},
{ t:'learn', title:'옵션표: marker · color · linestyle', body:`
<div class="opt3">
<table class="cmp"><tr><th colspan="2">marker 마커</th></tr><tr><td><code>'o'</code></td><td>● 원</td></tr><tr><td><code>'*'</code></td><td>★ 별</td></tr><tr><td><code>'s'</code></td><td>■ 사각형</td></tr><tr><td><code>'D'</code></td><td>◆ 다이아몬드</td></tr><tr><td><code>'^'</code></td><td>▲ 삼각형</td></tr><tr><td><code>'.'</code></td><td>· 점</td></tr><tr><td><code>'x'</code></td><td>× 엑스</td></tr></table>
<table class="cmp"><tr><th colspan="2">color 색</th></tr><tr><td><code>'r'</code></td><td>빨강 red</td></tr><tr><td><code>'g'</code></td><td>초록 green</td></tr><tr><td><code>'b'</code></td><td>파랑 blue</td></tr><tr><td><code>'c'</code></td><td>시안 cyan</td></tr><tr><td><code>'m'</code></td><td>마젠타 magenta</td></tr><tr><td><code>'y'</code></td><td>노랑 yellow</td></tr><tr><td><code>'k'</code></td><td>검정 black</td></tr></table>
<table class="cmp"><tr><th colspan="2">linestyle 선</th></tr><tr><td><code>'-'</code></td><td>━ 실선</td></tr><tr><td><code>'--'</code></td><td>╍ 짧은 선 반복 (<b>교과서는 '점선'이라고 부름</b>)</td></tr><tr><td><code>':'</code></td><td>┈ 아주 짧은 점 반복</td></tr><tr><td><code>'-.'</code></td><td>━·━ 선과 점 번갈아</td></tr></table>
</div>
<div class="tip">검정은 b가 아니라 <b>k</b>예요(b는 파랑). 옵션 값은 모두 <b>따옴표</b> 안에! 선 종류는 이름보다 <b>기호</b>(<code>'--'</code>, <code>':'</code>, <code>'-.'</code>)로 외우세요. 시험 조건도 기호로 나와요("선 종류: --").</div>`,
 code:`import matplotlib.pyplot as plt
x = [1, 2, 3, 4]
plt.plot(x, [1, 2, 3, 4], marker='o', color='r', linestyle='-')
plt.plot(x, [2, 3, 4, 5], marker='s', color='b', linestyle='--')
plt.plot(x, [3, 4, 5, 6], marker='D', color='g', linestyle=':')
plt.plot(x, [4, 5, 6, 7], marker='^', color='k', linestyle='-.')
plt.show()`},
{ t:'learn', title:'축 이름 · 범례', body:`
<table class="cmp"><tr><th>코드</th><th>하는 일</th></tr>
<tr><td><code>plt.xlabel('family')</code></td><td>가로축 이름</td></tr>

<tr><td><code>plt.legend()</code></td><td>범례 상자 표시</td></tr>
<tr><td><code>plt.title('제목')</code></td><td>그래프 제목</td></tr></table>
<div class="warn"><code>label=</code>만 쓰고 <code>plt.legend()</code>를 빼면 범례가 안 나와요. <b>둘은 세트</b>예요. (사진에서 빨간 글씨 두 곳)</div>

{ id:'c5', title:'머신러닝', short:'AI', mins:28, steps:[

{ t:'learn', title:'분류: 포도가 거봉인지 아닌지', body:`
<p><b>회귀</b>는 숫자(점수)를 예측하고, <b>분류</b>는 종류(거봉 1 / 아님 0)를 예측해요. 이진 분류에는 <b>LogisticRegression</b>(로지스틱 회귀)을 써요.</p>
<table class="cmp"><tr><th>코드</th><th>뜻</th></tr>
<tr><td><code>grape[:, :2]</code></td><td>전체 행, 0~1번 열 → 크기, 무게 (X)</td></tr>
<tr><td><code>grape[:, 2]</code></td><td>전체 행, 2번 열 → 거봉 여부 (y, 레이블)</td></tr>
<tr><td><code>X</code>, <code>y</code></td><td>시험지 표 그대로: X = <b>독립 변수</b> 2개(크기, 무게), y = <b>종속 변수</b>(거봉 여부)</td></tr>
<tr><td><code>model.coef_</code></td><td>학습한 가중치(계수)</td></tr>
<tr><td><code>model.intercept_</code></td><td>학습한 편향(절편)</td></tr>
<tr><td><code>float(input(...))</code></td><td>소수 입력받기</td></tr></table>
<div class="tip">슬라이싱 <code>[행, 열]</code>: <code>:</code>만 쓰면 전체, <code>:2</code>는 0번~1번(2 미포함).</div>
<p><b>if / else 처음 보죠?</b> "만약 ~이면 이걸 하고, 아니면 저걸 해"라는 뜻이에요.</p>
<pre class="code">if(result==1) :        # 만약 result가 1이면
    print('거봉')       # ← 이 줄 실행 (앞에 공백 4칸)
else :                 # 아니면
    print('거봉 아님')  # ← 이 줄 실행 (앞에 공백 4칸)</pre>
<ul><li><code>==</code>는 <b>같은지 비교</b>예요. (<code>=</code> 하나는 "상자에 넣어라"였죠)</li>
<li>줄 끝에 콜론 <code>:</code>을 꼭 써요.</li>
<li>if/else 안쪽 줄은 앞에 <b>공백 4칸</b>(Tab 키) 들여쓰기를 해요. 안 하면 IndentationError가 나요.</li></ul>
<p>입력값 칸에 <b>두 줄</b>(크기, 무게)을 넣어요.</p>
<p class="dim">coef_·intercept_ 숫자는 Thonny에서 소수 끝자리가 조금 다를 수 있어요. 예측 결과(거봉/거봉 아님)는 같아요.</p>`,

    return `<code>${n}</code>라는 이름이 아직 없어요. 철자(대소문자)를 확인하거나, 이 변수를 만들기 전에 쓰지 않았는지 보세요. 문자라면 따옴표 <code>'${n}'</code>가 필요해요.`;}
  if(t==='KeyError') return `${esc(m)} 라는 행/열 이름을 찾을 수 없어요. 철자와 대소문자를 확인하세요. 열 여러 개는 <code>df[['a', 'b']]</code> 두 겹, 행은 <code>df.loc[...]</code>, 열을 drop할 땐 <code>axis=1</code>이에요.`;
  if(t==='IndentationError') return '들여쓰기(줄 앞 공백)가 맞지 않아요. if/else 안쪽 줄만 4칸 들여 쓰고, 나머지 줄은 맨 앞에서 시작하세요.';
  if(t==='SyntaxError'){
    if(/never closed|unmatched|unexpected EOF|was never closed|does not match/.test(m)) return '괄호 <code>( ) [ ] { }</code> 짝이 안 맞아요. 여는 괄호와 닫는 괄호 개수를 세어 보세요.';
    if(/unterminated string|EOL/.test(m)) return '따옴표가 닫히지 않았어요. <code>\'...\'</code> 짝을 확인하세요.';
    if(/Perhaps you forgot a comma/.test(m)) return '값 사이에 쉼표 <code>,</code>가 빠진 것 같아요.';
    if(/expected ':'/.test(m)) return 'if / else 줄 끝에 콜론 <code>:</code>이 필요해요.';
    return '문법 오류예요. 표시된 줄에서 쉼표, 콜론, 괄호, 따옴표를 확인하세요.';}
  if(/cannot reshape/.test(m)) return 'reshape의 <b>행 × 열</b>이 원소 개수와 달라요. 예: 원소 6개 → (2, 3) 또는 (3, 2).';
  if(/Expected 2D array/.test(m)) return 'sklearn은 2차원 입력이 필요해요. 학습은 <code>x.reshape(-1, 1)</code>, 예측은 <code>[[pre_x]]</code>처럼 대괄호 두 겹으로.';
  if(/Length of values|does not match length of index|Columns must be same length/.test(m)) return '넣는 값의 개수가 행(또는 열) 개수와 달라요. 개수를 세어 보세요.';
  if(/cannot set a row with mismatched columns/.test(m)) return '새 행의 값 개수가 열 개수와 달라요.';
  if(/has no attribute 'median'/.test(m)) return '배열에는 <code>.median()</code>이 없어요. <code>np.median(a, axis=...)</code>로 쓰세요.';
  if(t==='AttributeError'){const a=m.match(/has no attribute '(\w+)'/);return `<code>${a?a[1]:''}</code>라는 함수/속성이 없어요. 철자와 대소문자를 확인하세요. (예: DataFrame, Series는 대문자, set_index, reshape는 소문자)`;}
  if(t==='ModuleNotFoundError'||t==='ImportError') return 'import할 이름의 철자를 확인하세요: <code>numpy</code>, <code>pandas</code>, <code>matplotlib.pyplot</code>, <code>sklearn.linear_model</code>';
  if(/could not convert string to float|invalid literal for int/.test(m)) return '입력값이 숫자가 아니에요. 입력값 칸에 숫자만 적어주세요.';
  if(/not a valid value for (ls|linestyle)|Unrecognized marker|not a valid value for color|Invalid RGBA|is not a valid color/.test(m)) return 'marker / color / linestyle 값이 잘못됐어요. 옵션표를 확인하세요 (예: \'*\', \'m\', \'--\').';
  if(/x and y must have same first dimension/.test(m)) return 'x와 y의 개수가 달라요.';
  if(/not subscriptable/.test(m)&&/builtin_function|function/.test(m)) return /np\.array\s*\[/.test(err.text||'')?'<code>np.array</code> 바로 뒤에 <b>소괄호 <code>(</code></b>가 빠졌어요. <code>np.array([[...], [...]])</code>처럼 <code>np.array(</code>로 열고 맨 끝을 <code>]])</code>로 닫으세요.':'함수 이름 바로 뒤에 대괄호 <code>[ ]</code>를 붙였어요. 함수는 <b>소괄호 <code>( )</code></b>로 실행해요. 예: <code>np.array([...])</code>, <code>print(x)</code>';
  if(t==='TimeoutError') return '5초 넘게 끝나지 않아서 멈췄어요. 반복(while)이 끝나는지 확인하세요.';
  if(/출력이 너무 많아요/.test(m)) return '출력이 너무 많아서 멈췄어요. 반복이 끝나지 않는지 확인하세요.';
  if(/format string/.test(m)) return "plot의 세 번째 값(예: <code>'bo'</code>, <code>'m*--'</code>)에 쓸 수 없는 글자가 있어요. 색 한 글자 + 마커 + 선 모양으로 써요.";
  if(/No axis named|is not callable/.test(m)) return '<code>loc</code>나 열 선택은 소괄호가 아니라 <b>대괄호</b>예요: <code>df.loc[\'grandpa\']</code>, <code>df[[\'age\']]</code>';
  if(/could not be broadcast/.test(m)) return '두 배열의 모양(행×열)이 맞지 않아 계산할 수 없어요. reshape 결과의 모양을 확인하세요.';
  if(/All arrays must be of the same length/.test(m)) return '딕셔너리 각 열의 값 개수가 서로 달라요. 모두 5개인지 세어 보세요.';
  if(t==='IndexError') return '없는 칸 번호를 썼어요. 칸 번호는 0부터 시작해요.';
  if(t==='TypeError') return '함수에 넣은 값의 종류나 개수가 맞지 않아요. 괄호 안 순서와 <code>이름=값</code>을 확인하세요.';
  if(t==='ValueError') return '값이 맞지 않아요. 개수와 모양을 확인하세요.';
  return '오류가 났어요. 표시된 줄의 철자, 괄호, 따옴표, 쉼표를 확인하세요.';
}

  let i=FLAT.findIndex(f=>f.key===k);if(i<0){const oi=OLDKEYS.indexOf(k);for(let j=oi+1;j<OLDKEYS.length&&i<0;j++)i=FLAT.findIndex(f=>f.key===OLDKEYS[j])}

const MK={'o':'원','*':'별','s':'사각형','D':'다이아몬드','^':'삼각형','.':'점','x':'엑스','None':'없음','':'없음'};
const LSN={'-':"'-'",'--':"'--'",'-.':"'-.'",':':"':'",'None':'선 없음'};
const CN={'#ff0000':'빨강 r','#008000':'초록 g','#0000ff':'파랑 b','#00bfbf':'시안 c','#bf00bf':'마젠타 m','#bfbf00':'노랑 y','#000000':'검정 k','#1f77b4':'기본 파랑(색 지정 안 함)'};
const nx=v=>{const n=Number(v);return isFinite(n)&&v!==''?String(n):v};
function comparePlots(u,r){
  const probs=[];
  if(!u.figs.length){probs.push(u.noshow.length?'<code>plt.show()</code>가 없어서 그래프가 안 떠요.':'그래프가 그려지지 않았어요. <code>plt.plot(...)</code>과 <code>plt.show()</code>를 확인하세요.');return probs}
  const uf=u.figs[0],rf=r.figs[0];const ua=uf.axes[0]||{lines:[]},ra=rf.axes[0]||{lines:[]};
  if(ua.lines.length!==ra.lines.length)probs.push(`선(plot)의 개수가 달라요: 목표 ${ra.lines.length}개, 내 그래프 ${ua.lines.length}개`);
  ra.lines.forEach((rl,i)=>{const ul=ua.lines[i];if(!ul)return;
    if(ul.marker!==rl.marker)probs.push(`마커가 달라요: 목표 <code>'${esc(rl.marker)}'</code>(${MK[rl.marker]||''}), 내 코드 <code>'${esc(ul.marker)}'</code>(${MK[ul.marker]||''})`);
    if(ul.color!==rl.color)probs.push(`색이 달라요: 목표 ${CN[rl.color]||rl.color}, 내 코드 ${CN[ul.color]||ul.color}${/^#ff00ff|^#00ffff|^#ffff00/.test(ul.color)?' (<code>\'magenta\'</code> 같은 이름 말고 한 글자 <code>\'m\'</code>, <code>\'c\'</code>, <code>\'y\'</code>로 쓰세요)':''}`);
    if(ul.ls!==rl.ls)probs.push(`선 종류가 달라요: 목표 <code>${LSN[rl.ls]||esc(rl.ls)}</code>, 내 코드 <code>${LSN[ul.ls]||esc(ul.ls)}</code>`);
    if(ul.label!==rl.label)probs.push(`label이 달라요: 목표 <code>'${esc(rl.label)}'</code>, 내 코드 <code>'${esc(ul.label)}'</code>`);
    if(ul.x.map(nx).join('|')!==rl.x.map(nx).join('|'))probs.push(`x 데이터가 달라요: 목표 [${rl.x.map(nx).join(', ')}]`);
    if(ul.y.map(nx).join('|')!==rl.y.map(nx).join('|'))probs.push(`y 데이터가 달라요: 목표 [${rl.y.map(nx).join(', ')}]`);
  });
  if(ua.xlabel!==ra.xlabel)probs.push(`x축 이름이 달라요: 목표 <code>'${esc(ra.xlabel)}'</code>, 내 코드 <code>'${esc(ua.xlabel)}'</code>`);
  if(ua.ylabel!==ra.ylabel)probs.push(`y축 이름이 달라요: 목표 <code>'${esc(ra.ylabel)}'</code>, 내 코드 <code>'${esc(ua.ylabel)}'</code>`);
  if(ua.title!==ra.title)probs.push(`제목이 달라요: 목표 <code>'${esc(ra.title)}'</code>`);
  if(ua.legend!==ra.legend)probs.push(ra.legend?'범례가 없어요. <code>plt.legend()</code>를 넣으세요.':'범례는 필요 없어요.');
  if(rf.size.join()!==uf.size.join())probs.push(`그래프 크기가 달라요: 목표 figsize=(${rf.size.join(', ')})`);
  return probs;
}

const FAILS={};
/* 오프라인 힌트: 내 코드와 기준 코드에서 처음 달라진 줄 찾기 (주석·띄어쓰기 무시) */
function lineDiff(mine,ref,label){
  const clean=t=>t.split('\n').map(l=>({raw:l.trim(),k:l.replace(/\s+#.*$|^\s*#.*$/,'').replace(/\s+/g,'').replace(/"/g,"'")})).filter(x=>x.k);
  const a=clean(mine),b=clean(ref);
  for(let i=0;i<b.length;i++){
    if(!a[i]) return `<b>${i+1}번째 줄</b>부터 빠졌어요. ${label}의 다음 줄을 이어서 쓰세요.<div class="diff"><div><span>${label}</span><pre>${esc(b[i].raw.replace(/\s+#.*$/,''))}</pre></div><div><span>내 코드</span><pre>(없음)</pre></div></div>`;
    if(a[i].k!==b[i].k){
      // 어느 글자부터 다른지
      let j=0;const x=a[i].k,y=b[i].k;while(j<x.length&&x[j]===y[j])j++;
      return `<b>${i+1}번째 줄</b>이 ${label}${label==='정답'?'과':'와'} 달라요${j<y.length?` (<code>${esc(y.slice(Math.max(0,j-3),j+6))}</code> 근처)`:''}.<div class="diff"><div><span>${label}</span><pre>${esc(b[i].raw.replace(/\s+#.*$/,''))}</pre></div><div><span>내 코드</span><pre>${esc(a[i].raw)}</pre></div></div>`;
    }
  }
  if(a.length>b.length) return `${label}에 없는 줄이 더 있어요: <code>${esc(a[b.length].raw)}</code>`;
  return '';
}
function isSubseq(exp,got){const e=exp.split('\n'),g=got.split('\n');let j=0;for(const l of g){if(j<e.length&&l===e[j])j++}return j===e.length}
const sq=x=>x.split('\n').map(l=>l.replace(/\s+/g,'')).filter(l=>l).join('\n');
// 학생 출력 정리: 배열 a를 먼저 출력한 줄 빼기, '이름표 [...]' 같은 이름표 떼기 (넘파이 문제)
async function cleanOut(step,txt){
  let lines=sq(txt).split('\n');
  if(step.ignore){const ig=await runPy(step.ignore,'');const blk=sq(ig.gout||ig.out).split('\n');
    // 배열 a를 출력한 연속된 줄 덩어리만 빼기
    for(let i=0;i+blk.length<=lines.length;i++){if(blk.every((b,k)=>lines[i+k]===b)){lines.splice(i,blk.length);break}}}
  if(step.ignore) lines=lines.map(l=>/\[/.test(l)?l.replace(/^[^\[\d\-]+(?=\[)/,''):l.replace(/^[^\dTF\-\[]+(?=(True|False)$)/,''));
  return lines.join('\n');
}
async function sameOut(step,uo,ro){const a=await cleanOut(step,uo),b=sq(ro);return step.lenient?isSubseq(b,a):a===b}
async function doCheck(step,key,code,stdin){
  const pid=PID;
  const v=$('#verdict');v.hidden=false;v.className='verdict wait';v.innerHTML='채점 중…';
  let u,r;
  try{[u,r]=await Promise.all([doRun(code,stdin),runRef(step)])}catch(e){v.hidden=true;toast('파이썬을 불러오지 못했어요. 새로고침해 주세요.');return}
  if(!u||PID!==pid){v.hidden=true;return}
  let probs=[];
  if(u.err) probs.push(`오류가 나서 끝까지 실행되지 않았어요. 아래 <b>${NOCOACH?'오류 해설':'코치 해설'}</b>을 보세요.`);
  else if(step.check==='plot') probs=comparePlots(u,r);
  else{
    const uo=u.gout!=null?u.gout:u.out, ro=r.gout!=null?r.gout:r.out;
    let ok=await sameOut(step,uo,ro);
    if(!ok&&step.alt){for(const alt of step.alt){const ar=await runPy(alt,step.inputs||'');if(await sameOut(step,uo,ar.gout!=null?ar.gout:ar.out)){ok=true;break}}}
    if(ok&&step.inputs2){const u2=await runPy(code,step.inputs2),r2=await runPy(step.ref,step.inputs2);
      if(u2.err||!(await sameOut(step,u2.gout,r2.gout))){ok=false;probs.push(`다른 입력값(<code>${esc(step.inputs2).replace(/\n/g,', ')}</code>)으로도 확인했는데 결과가 달라요. 결과를 직접 print하지 말고 모델로 예측하게 쓰세요.`)}}
    const a=norm(uo),b=norm(ro);
    if(!ok&&!probs.length){
      if(!a) probs.push('출력이 없어요. <code>print( )</code>로 결과를 출력하세요.');
      else{const al=a.split('\n').filter(l=>l.trim()),bl=b.split('\n').filter(l=>l.trim());const z=l=>(l||'').replace(/\s+/g,'');let i=0;while(i<Math.max(al.length,bl.length)&&z(al[i])===z(bl[i]))i++;
        probs.push(`출력이 목표와 달라요. <b>${i+1}번째 줄</b>부터 달라요.<div class="diff"><div><span>목표</span><pre>${esc(bl[i]??'(없음)')}</pre></div><div><span>내 출력</span><pre>${esc(al[i]??'(없음)')}</pre></div></div>`)}
    }
  }
  const codeNC=code.split('\n').map(l=>l.replace(/(^|\s)#.*$/,'')).join('\n');
  (step.must||[]).forEach(([re,msg])=>{if(!new RegExp(re).test(codeNC))probs.push(msg)});
  if(!probs.length){v.className='verdict pass';v.innerHTML='<b>통과!</b> 목표와 똑같아요. 아래 <b>다음 →</b>을 누르세요.';markDone(key);const ms=$('#mission');if(ms){ms.classList.add('done');ms.querySelector('.ms-h').innerHTML='<span class="ms-tag">할 일</span><span class="ms-ok">✓ 통과함</span>'}}
  else{const F=(FAILS[key]=(FAILS[key]||0)+1);let hint='';
    if(step.t==='learn'){const dd=lineDiff(code,step.code,'예제');if(dd)hint=`<div class="autohint"><b>힌트</b> ${dd}</div>`}
    else{const hs=step.hints||[];const n=Math.min(F,hs.length);if(n)hint=`<div class="autohint"><b>힌트 ${n}/${hs.length}</b> <code>${esc(hs[n-1])}</code>${n<hs.length?'<span class="dim"> · 또 틀리면 다음 힌트가 나와요</span>':''}</div>`;
      if(F>=3){const dd=lineDiff(code,step.ref,'정답');if(dd)hint+=`<div class="autohint"><b>정답과 비교</b> ${dd}</div>`}}
    v.className='verdict fail';v.innerHTML='<b>아직이에요.</b><ul>'+probs.map(p=>'<li>'+p+'</li>').join('')+'</ul>'+hint+'<button class="ghost sm" id="askfail">AI 코치에게 물어보기</button>';$('#askfail').onclick=()=>coachAsk('채점에서 틀렸다고 나와. 뭐가 문제인지 힌트를 줘. 정답 코드는 아직 주지 마.')}
}

let SAMPLE=null, coachTurns=[], coachCtl=null;
const NOCOACH=!!window.NO_COACH;if(NOCOACH)document.body.classList.add('no-coach');

function updateCoachAvail(){const n=$('#coach-note');if(!n)return;n.hidden=!!SAMPLE;$('#coach-send').disabled=!SAMPLE}
const COACH_RULES=`너는 한국 고등학교 2학년 '소프트웨어와 생활' 수행평가 대비 파이썬 코치다.
- 학생은 파이썬 기초만 알고 넘파이·판다스·맷플롯립은 이번에 처음 배운다.
- 실제 시험은 종이에 손으로 코드를 쓰는 방식이고, 학교 실습 환경은 Thonny다(구글 코랩 아님: 결과는 print()로, 그래프는 plt.show()로 봐야 한다).
- 시험 범위: 넘파이(2차원 배열·합계/중앙값/평균/최댓값/최솟값/분산/표준편차/any/all/where, arange, reshape, 배열 연산), 판다스(시리즈·데이터프레임 생성, 열/행 추출, loc, 열·행 추가, insert, 값 변경, rename, T, drop, set_index·inplace), 맷플롯립(plot의 marker·color·linestyle·label, xlabel, ylabel, legend, show), 스마트폰 시간-점수 그래프(figure, title, 'bo'), LinearRegression 예측과 기계학습 과정 설명, LogisticRegression 포도 분류. 문제는 숫자·이름·조건이 살짝 바뀌어 나올 수 있다.
- 선 종류는 기호('-', '--', ':', '-.')로 말한다. 교과서는 '--'를 '점선'이라고 부른다. 시리즈로 데이터프레임 만들기는 교과서처럼 행마다 Series를 만들어 리스트로 넣는다. drop은 axis(행 0, 열 1)와 inplace=True, 전치는 transpose(), rename은 inplace=True 방식도 인정한다.
- axis는 학교 교과서 기준을 따른다: '행끼리/행별/행의 원소 합계' = axis=0, '열끼리/열별' = axis=1. 넘파이 함수는 교과서처럼 np.sum(a, axis=0) 형식을 우선한다.
- 한국어로, 친근한 존댓말로, 짧게(보통 3~8줄) 답한다. 핵심부터 말한다.
- 학생이 정답을 달라고 하기 전에는 전체 정답 코드를 주지 말고, 틀린 부분을 짚어주고 고칠 방향과 작은 코드 조각만 준다.
- 코드는 \`\`\`python 블록으로 짧게. 시험에서 외우기 쉬운 형태를 우선한다.`;
function stepContext(){

  if(LAST.out||LAST.err)c+=`[마지막 실행 결과]\n${(LAST.out||'').slice(0,1500)}${LAST.err?`\n오류: ${LAST.err.type}: ${LAST.err.msg} (${LAST.err.line}번째 줄)`:''}\n`;

  return c;
}

    const code=e&&e.code;
    if(code==='cancelled'){if(!e.text)bub.innerHTML='<span class="dim">멈췄어요.</span>'}
    else bub.innerHTML=(e.text?md(e.text)+'<br>':'')+'<span class="bad">'+({not_granted:'AI 코치 사용이 허용되지 않았어요. 페이지의 권한 설정에서 허용할 수 있어요.',rate_limited:'요청이 많아요. 잠시 후 다시 물어보세요.',session_expired:'claude.ai에 다시 로그인해 주세요.',sampling_disabled:'이 계정에서는 AI 코치를 쓸 수 없어요.'}[code]||'답변을 받지 못했어요. 다시 시도해 주세요.')+'</span>';
  }finally{$('#coach-stop').hidden=true}
}
$('#coach-stop').onclick=()=>coachCtl&&coachCtl.abort();

/* ===== 프로필 ===== */
function showProfiles(){
  save();const o=$('#profiles');o.hidden=false;
  const cards=[...PROFS.list].sort((a,b)=>(b.id===PROFS.last)-(a.id===PROFS.last)).map(p=>{const st=loadState(p.id);const n=FLAT.filter(f=>st.done[f.key]).length;const pct=Math.round(n/FLAT.length*100);
    return `<div class="pf-card ${p.id===PID?'cur':''}"><button class="pf-pick" data-id="${p.id}"><b>${esc(p.name)}</b><span class="pf-bar" style="--p:${pct/100}"></span><span class="pf-meta">진도 ${pct}% · 학습 ${fmt(st.elapsed)}</span></button><button class="pf-del ghost sm" data-id="${p.id}">삭제</button></div>`}).join('');
  o.innerHTML=`<div class="pf-box"><div class="eyebrow">PROFILE <span>프로필</span></div><h1>누가 공부하나요?</h1>
   <p class="dim">프로필마다 진도, 내가 쓴 코드, 학습 시간이 따로 저장돼요. 기록은 이 컴퓨터의 이 브라우저에만 저장돼요.</p>
   <div class="pf-list">${cards||'<p class="dim">아직 프로필이 없어요. 아래에서 이름을 넣고 만들어 주세요.</p>'}</div>
   <form class="pf-new" id="pfnew"><input id="pfname" maxlength="20" placeholder="이름 (예: 용가리)" autocomplete="off"><button class="btn run" type="submit"><span>＋ 새 프로필 만들기</span></button></form>
   ${PID?'<button class="ghost" id="pfclose">닫고 계속하기</button>':''}</div>`;
  o.querySelectorAll('.pf-pick').forEach(b=>b.onclick=()=>useProfile(b.dataset.id));
  o.querySelectorAll('.pf-del').forEach(b=>b.onclick=()=>{
    if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='정말 삭제? 한 번 더';setTimeout(()=>{b.classList.remove('arm');b.textContent='삭제'},3000);return}
    const id=b.dataset.id;PROFS.list=PROFS.list.filter(p=>p.id!==id);savePro();try{localStorage.removeItem('pyexam-v2:'+id)}catch(e){}
    if(id===PID){PID=null;S=fresh()}showProfiles()});
  $('#pfnew').onsubmit=e=>{e.preventDefault();const nm=$('#pfname').value.trim();if(!nm){$('#pfname').focus();return}
    const btn=$('#pfnew button');if(btn.disabled)return;btn.disabled=true;
    const nk=x=>x.replace(/\s+/g,'').toLowerCase();const same=PROFS.list.find(p=>nk(p.name)===nk(nm));if(same)return useProfile(same.id);
    const id='p'+Date.now().toString(36);PROFS.list.push({id,name:nm});savePro();useProfile(id)};
  const c=$('#pfclose');if(c)c.onclick=()=>{o.hidden=true};
  setTimeout(()=>{const i=$('#pfname');if(i&&!PROFS.list.length)i.focus()},0);
}
function useProfile(id){
  save();STALE=false;PID=id;S=fixPos(loadState(id));
  if(MOCK){const first=FLAT.findIndex(f=>CHAPTERS[f.ci].id==='c6');const mi=S.mockKey?FLAT.findIndex(f=>f.key===S.mockKey):-1;S.pos=mi>=0?mi:first;setTimeout(()=>toast('모의고사 바로가기예요. 평소 학습 위치는 그대로 저장돼 있어요.'),300)}try{localStorage.setItem(OWN(id),TAB)}catch(e){}PROFS.last=id;savePro();
  const p=PROFS.list.find(x=>x.id===id);$('#who').innerHTML=`<span>👤</span> ${esc(p?p.name:'')}`;
  $('#profiles').hidden=true;SCR=false;tickLast=Date.now();coachTurns=[];render();renderTimer();
}
$('#who').onclick=showProfiles;

/* ===== 이동 ===== */
$('#prev').onclick=()=>SCR?go(S.pos):go(S.pos-1);
$('#next').onclick=()=>{if(SCR)return go(S.pos);
  if(!S.done[FLAT[S.pos].key]){toast('🔒 <b>이 단계를 통과해야 넘어갈 수 있어요.</b> 오른쪽 위 <b>할 일</b>을 확인하세요.');const m=$('.mission');if(m){m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake')}return}
  if(S.pos<FLAT.length-1)go(S.pos+1)};
$('#scratch-btn').onclick=()=>{SCR=!SCR;render()};
$('#timer-reset').onclick=()=>{const b=$('#timer-reset');if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='한 번 더 누르면 0으로';setTimeout(()=>{b.classList.remove('arm');b.textContent='↺ 타이머 초기화'},3000);return}
  b.classList.remove('arm');b.textContent='↺ 타이머 초기화';S.elapsed=0;tickLast=Date.now();save();renderTimer()};
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,.CodeMirror'))return;if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();$('#next').click()}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();$('#prev').click()}});
setPyPill();renderTimer();render();updateCoachAvail();showProfiles();BOOTED=true;
if(window.NO_COACH&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  const checkOffline=async()=>{try{const ok=await caches.match('py/pyodide.asm.wasm')&&await caches.match('py/w_pandas-2.2.0-cp312-cp312-pyodide_2024_0_wasm32.wasm');
    const p=$('#offpill');if(p){p.hidden=false;p.textContent=ok?'오프라인 준비 완료':'오프라인 저장 중…';p.className='pypill '+(ok?'ready':'loading')}
    if(!ok)setTimeout(checkOffline,3000)}catch(e){}};
  navigator.serviceWorker.ready.then(checkOffline);
}

/* 자체 점검: 모든 정답 코드가 오류 없이 도는지 (개발용) */
window.__selfTest=async()=>{const bad=[];for(let i=0;i<FLAT.length;i++){const s=stepAt(i);const code=s.ref||(s.t==='learn'&&s.code);if(!code)continue;const r=await runPy(code,s.inputs||'');if(r.err)bad.push([FLAT[i].key,s.title,r.err.type,r.err.msg]);}
 for(const k of ['np1','np2','np3','pd1','pdx','pdx','pdx','pdx','pdx','pdx','plot','ml'])for(let j=0;j<4;j++){const s=genStep(k);const r=await runPy(s.ref,s.inputs||'');if(r.err)bad.push([k,s.title,r.err.type,r.err.msg,s.ref])}
 return bad};

</script>
